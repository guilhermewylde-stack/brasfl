// =====================================================================================
// === 2. PURE ENGINE ==================================================================
// Funções puras: nenhuma lê ou escreve DOM, localStorage ou relógio. A aleatoriedade é
// injetada via `rng: () => number`, tornando toda simulação determinística e testável.
// =====================================================================================

// --- 2.1 Utilidades numéricas -------------------------------------------------------
/** Mulberry32: PRNG semeável. @param {number} seed */
function makeRng(seed) {
  let a = seed >>> 0;
  return function rng() {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const round1 = (x) => Math.round(x * 10) / 10;
const randInt = (rng, lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));
const pickOne = (rng, arr) => arr[Math.floor(rng() * arr.length)];
const otherSide = (/** @type {Side} */ s) => (s === 'home' ? 'away' : 'home');
const sum = (arr) => arr.reduce((a, b) => a + b, 0);
const avg = (arr) => (arr.length ? sum(arr) / arr.length : 0);
function gauss(rng, mean, sd) {
  let u = 0;
  while (u === 0) u = rng();
  return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng());
}
function shuffle(rng, arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/** @template T @param {() => number} rng @param {T[]} items @param {(t:T) => number} weight @returns {T} */
function weightedPick(rng, items, weight) {
  const ws = items.map((i) => Math.max(0.0001, weight(i)));
  let r = rng() * sum(ws);
  for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}
const emptyStats = () => ({ yds: 0, td: 0, sacks: 0, ints: 0, fg: 0 });
const emptyRecord = () => ({ w: 0, l: 0, t: 0, pf: 0, pa: 0 });

// --- 2.2 Economia ---------------------------------------------------------------------
/** Salário de mercado (milhões/ano) por força e posição. */
function salaryFor(ovr, position) {
  const curve = Math.pow(clamp((ovr - 50) / 49, 0, 1), 2.2) * 24;
  return round1(Math.max(0.6, (0.5 + curve) * POS_SALARY_MULT[position]));
}
/** Valor de transferência: salário × fator idade. */
function marketValue(p) {
  const ageFactor = p.age <= 24 ? 3.2 : p.age <= 27 ? 2.8 : p.age <= 30 ? 2.0 : p.age <= 33 ? 1.2 : 0.6;
  return round1(Math.max(0.5, p.salary * ageFactor));
}
const signingBonus = (p) => round1(p.salary * 0.2);
const releaseCost = (p) => round1(p.salary * 0.25);
const rookieSalary = (round, ovr) => round1(Math.max(0.75, [2.5, 1.2, 0.8][round - 1] + (ovr - 60) * 0.05));

/**
 * Situação do teto salarial de uma franquia.
 * @param {Team} team @param {Player[]} roster
 */
function processSalaryCap(team, roster) {
  const payroll = round1(sum(roster.filter((p) => p.teamId === team.id).map((p) => p.salary)));
  const cap = LEAGUE_RULES.SALARY_CAP;
  return { payroll, cap, capSpace: round1(cap - payroll), overCap: payroll > cap, pct: clamp(payroll / cap, 0, 1.5), weeklyCost: round1(payroll / LEAGUE_RULES.SALARY_WEEKS) };
}

// --- 2.3 Geração procedural ---------------------------------------------------------
/**
 * @param {() => number} rng @param {() => string} nextId @param {Position} position
 * @param {number} target OVR alvo @param {string|null} teamId @param {[number, number]} ageRange
 * @returns {Player}
 */
function generatePlayer(rng, nextId, position, target, teamId, ageRange = [22, 34]) {
  const ovr = clamp(Math.round(gauss(rng, target, 3.5)), 48, 97);
  const trait = rng() < 0.24 ? pickOne(rng, TRAITS_BY_POSITION[position]) : null;
  return {
    id: nextId(), name: `${pickOne(rng, FIRST_NAMES)} ${pickOne(rng, LAST_NAMES)}`, age: randInt(rng, ageRange[0], ageRange[1]),
    position, ovr, energy: 100, morale: randInt(rng, 55, 75), salary: salaryFor(ovr, position), trait, teamId,
    starter: false, injuryWeeks: 0, stats: emptyStats(),
  };
}

/** Elenco de 20 jogadores: titulares ~base+2, reservas ~base-7. */
function generateTeamRoster(rng, nextId, teamId, base) {
  /** @type {Player[]} */
  const roster = [];
  for (const pos of POSITIONS) {
    for (let i = 0; i < ROSTER_TEMPLATE[pos]; i++) {
      const isStarter = i < STARTER_SLOTS[pos];
      roster.push(generatePlayer(rng, nextId, pos, isStarter ? base + 2 : base - 7, teamId, isStarter ? [23, 34] : [21, 30]));
    }
  }
  // Garante payroll abaixo do teto com folga (contratos "cap-friendly" na criação da liga).
  const payroll = sum(roster.map((p) => p.salary));
  const target = LEAGUE_RULES.SALARY_CAP * 0.92;
  if (payroll > target) roster.forEach((p) => { p.salary = round1(Math.max(0.6, p.salary * (target / payroll))); });
  return roster;
}

function generateFreeAgents(rng, nextId, count) {
  const weights = { QB: 2, RB: 2, WR: 3, TE: 1.5, OL: 3, DL: 3, LB: 2, DB: 3, K: 1 };
  return Array.from({ length: count }, () => {
    const pos = weightedPick(rng, POSITIONS, (p) => weights[p]);
    const p = generatePlayer(rng, nextId, pos, randInt(rng, 56, 71), null, [24, 34]);
    p.salary = round1(Math.max(0.6, p.salary * 0.8));
    return p;
  });
}

/**
 * Classe universitária: 56 prospectos (21–23 anos).
 * @param {number} seasonYear @param {() => number} rng @param {() => string} nextId
 */
function generateDraftClass(seasonYear, rng, nextId) {
  const distribution = { QB: 5, RB: 6, WR: 9, TE: 4, OL: 8, DL: 8, LB: 6, DB: 8, K: 2 };
  /** @type {Player[]} */
  const prospects = [];
  for (const pos of POSITIONS) {
    for (let i = 0; i < distribution[pos]; i++) {
      // Classes de anos pares/ímpares variam levemente — "safras" melhores ou piores.
      const vintage = (seasonYear % 3) - 1;
      const elite = rng() < 0.06;
      const p = generatePlayer(rng, nextId, pos, elite ? 79 : 63 + vintage, null, [21, 23]);
      p.ovr = clamp(p.ovr + (elite ? randInt(rng, 0, 5) : 0), 50, 88);
      p.salary = round1(Math.max(0.6, salaryFor(p.ovr, pos) * 0.5));
      p.morale = 70;
      prospects.push(p);
    }
  }
  return prospects;
}

/** Calendário balanceado (método do círculo): cada time enfrenta 14 dos 15 rivais. */
function generateSchedule(teamIds, weeks, rng) {
  const ids = shuffle(rng, teamIds);
  const n = ids.length;
  /** @type {Fixture[]} */
  const fixtures = [];
  for (let r = 0; r < weeks; r++) {
    for (let i = 0; i < n / 2; i++) {
      const a = ids[i], b = ids[n - 1 - i];
      const aHome = (r + i) % 2 === 0;
      fixtures.push({ id: `w${r + 1}-g${i + 1}`, week: r + 1, homeId: aHome ? a : b, awayId: aHome ? b : a, neutral: false, result: null });
    }
    ids.splice(1, 0, ids.pop());
  }
  return fixtures;
}

// --- 2.4 Força e escalação ----------------------------------------------------------
const energyFactor = (e) => 0.6 + 0.4 * clamp(e, 0, 100) / 100;
const moraleFactor = (m) => 0.95 + clamp(m, 0, 100) * 0.001;
const energyOf = (p, energy) => (energy && energy[p.id] !== undefined ? energy[p.id] : p.energy);
const isGhost = (p) => p.id.startsWith('ghost');

/** @typedef {{ player: Player, mult: number }} LineupSlot */
/** @typedef {Record<Position, LineupSlot[]>} Lineup */

function ghostPlayer(position, i) {
  return { id: `ghost-${position}-${i}`, name: 'Improvisado', age: 25, position, ovr: 35, energy: 100, morale: 50, salary: 0, trait: null, teamId: null, starter: true, injuryWeeks: 0, stats: emptyStats() };
}

/** @param {LineupSlot} slot */
function effectiveRating(slot, energy, clutch) {
  const p = slot.player;
  return p.ovr * slot.mult * energyFactor(energyOf(p, energy)) * moraleFactor(p.morale) + (clutch && p.trait === 'CLUTCH' ? 4 : 0);
}

/**
 * Escalação efetiva em campo. Usuário: respeita titulares, substitui lesionados pelo melhor
 * reserva. IA (`autoSub`): escolhe sempre o melhor rendimento atual (força × energia).
 * Vagas sem jogador da posição recebem atletas improvisados (−30%) ou "fantasmas" OVR 35.
 * @returns {Lineup}
 */
function selectLineup(roster, energy, injuries, autoSub) {
  const out = new Set(injuries.map((i) => i.playerId));
  const healthy = roster.filter((p) => p.injuryWeeks === 0 && !out.has(p.id));
  const score = (p) => p.ovr * energyFactor(energyOf(p, energy));
  const used = new Set();
  /** @type {Lineup} */
  const lineup = /** @type {any} */ ({});
  for (const pos of POSITIONS) {
    const pool = healthy.filter((p) => p.position === pos)
      .sort((a, b) => (autoSub ? 0 : Number(b.starter) - Number(a.starter)) || score(b) - score(a));
    lineup[pos] = pool.slice(0, STARTER_SLOTS[pos]).map((p) => ({ player: p, mult: 1 }));
    lineup[pos].forEach((s) => used.add(s.player.id));
  }
  for (const pos of POSITIONS) {
    while (lineup[pos].length < STARTER_SLOTS[pos]) {
      const sub = healthy.filter((p) => !used.has(p.id)).sort((a, b) => score(b) - score(a))[0];
      if (sub) { used.add(sub.id); lineup[pos].push({ player: sub, mult: pos === 'K' ? 0.5 : 0.7 }); }
      else lineup[pos].push({ player: ghostPlayer(pos, lineup[pos].length), mult: 1 });
    }
  }
  return lineup;
}

/**
 * Força das unidades a partir da escalação + tática.
 * @param {Lineup} lineup @param {TacticConfiguration} tactic
 * @param {Record<string, number>} [energy] @param {boolean} [clutch]
 */
function calculateUnitStrength(lineup, tactic, energy = {}, clutch = false) {
  const e = (pos) => lineup[pos].map((s) => effectiveRating(s, energy, clutch));
  const traitCount = (positions, trait) => sum(positions.map((pos) => lineup[pos].filter((s) => s.player.trait === trait).length));
  const QB = e('QB')[0], RB = e('RB')[0], TE = e('TE')[0], K = e('K')[0];
  const WR = avg(e('WR')), OL = avg(e('OL')), DL = avg(e('DL')), LB = avg(e('LB')), DB = avg(e('DB'));
  let passing = 0.5 * QB + 0.3 * avg([...e('WR'), TE]) + 0.2 * OL;
  let rushing = 0.5 * RB + 0.4 * OL + 0.1 * TE;
  let passBlock = 0.75 * OL + 0.15 * TE + 0.1 * RB;
  let passRush = 0.6 * DL + 0.4 * LB + 3 * traitCount(['DL', 'LB'], 'PASS_RUSHER');
  let runDef = 0.45 * DL + 0.4 * LB + 0.15 * DB;
  let coverage = 0.7 * DB + 0.3 * LB + 3 * traitCount(['DB', 'LB'], 'LOCKDOWN');
  const off = tactic.offense, def = tactic.defense;
  if (off === 'GROUND_AND_POUND') { rushing *= 1.06; passing *= 0.95; passBlock *= 1.03; }
  if (off === 'AIR_RAID') { passing *= 1.05; rushing *= 0.94; passBlock *= 0.96; }
  if (off === 'WEST_COAST') { passing *= 1.02; passBlock *= 1.04; }
  if (def === 'RUN_STUFF') { runDef *= 1.08; coverage *= 0.95; }
  if (def === 'COVER_2_ZONE') { coverage *= 1.08; runDef *= 0.94; }
  if (def === 'BLITZ_HEAVY') { passRush *= 1.12; coverage *= 0.93; }
  return {
    passing, rushing, passBlock, passRush, runDef, coverage, kicking: K,
    offense: (passing + rushing) / 2,
    defense: passRush * 0.3 + runDef * 0.35 + coverage * 0.35,
  };
}
const tacticalSynergy = (off, def) => TACTICAL_SYNERGY[off][def];

/** Validação das posições obrigatórias (titulares saudáveis). */
function lineupValidation(roster) {
  const rows = POSITIONS.map((pos) => {
    const starters = roster.filter((p) => p.position === pos && p.starter);
    const healthy = starters.filter((p) => p.injuryWeeks === 0).length;
    const available = roster.filter((p) => p.position === pos && p.injuryWeeks === 0).length;
    const required = STARTER_SLOTS[pos];
    // Falta real de jogadores saudáveis não bloqueia: o motor escala um improvisado.
    const shortage = available < required;
    return { pos, required, filled: healthy, injured: starters.length - healthy, shortage, ok: healthy === required, blocking: healthy < Math.min(required, available) };
  });
  return { rows, ok: rows.every((r) => !r.blocking), complete: rows.every((r) => r.ok), starters: roster.filter((p) => p.starter).length };
}

/** IDs dos melhores titulares saudáveis por posição. */
function autoLineupIds(roster) {
  const ids = new Set();
  for (const pos of POSITIONS) {
    roster.filter((p) => p.position === pos && p.injuryWeeks === 0)
      .sort((a, b) => b.ovr * energyFactor(b.energy) - a.ovr * energyFactor(a.energy))
      .slice(0, STARTER_SLOTS[pos]).forEach((p) => ids.add(p.id));
  }
  return ids;
}

/** Tática da IA derivada do perfil do elenco. @returns {TacticConfiguration} */
function chooseAiTactic(roster) {
  const lineup = selectLineup(roster, {}, [], true);
  const r = calculateUnitStrength(lineup, { offense: 'BALANCED', defense: 'BALANCED', fourthDown: 'CONSERVATIVE' });
  const diff = r.passing - r.rushing;
  const cannon = lineup.QB[0].player.trait === 'CANNON_ARM';
  const offense = diff > 4 ? (cannon || diff > 7 ? 'AIR_RAID' : 'WEST_COAST') : diff < -3 ? 'GROUND_AND_POUND' : 'BALANCED';
  const defense = r.passRush > r.coverage + 3 ? 'BLITZ_HEAVY' : r.coverage > r.runDef + 3 ? 'COVER_2_ZONE' : r.runDef > r.coverage + 3 ? 'RUN_STUFF' : 'BALANCED';
  return { offense, defense, fourthDown: r.offense > 77 ? 'AGGRESSIVE' : 'CONSERVATIVE' };
}

// --- 2.5 Classificação --------------------------------------------------------------
const winPct = (r) => { const g = r.w + r.l + r.t; return g ? (r.w + 0.5 * r.t) / g : 0; };
/** @param {Record<string, Team>} teams @param {string[]} ids */
function computeStandings(teams, ids) {
  return ids.map((id) => ({ team: teams[id], ...teams[id].record, pct: winPct(teams[id].record), diff: teams[id].record.pf - teams[id].record.pa }))
    .sort((a, b) => b.pct - a.pct || b.diff - a.diff || b.pf - a.pf || a.team.id.localeCompare(b.team.id));
}

// --- 2.6 Motor de partida (play-by-play) --------------------------------------------
const fmtClock = (s) => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.max(0, s) % 60).padStart(2, '0')}`;
const quarterLabel = (q) => (q <= 4 ? `Q${q}` : q === 5 ? 'OT' : `OT${q - 4}`);

/**
 * @param {Fixture} fixture @param {Player[]} homeRoster @param {Player[]} awayRoster
 * @param {{verbose:boolean, playoff:boolean}} opts @param {() => number} rng
 * @returns {MatchState}
 */
function createMatchState(fixture, homeRoster, awayRoster, opts, rng) {
  const energy = {};
  [...homeRoster, ...awayRoster].forEach((p) => { energy[p.id] = p.energy; });
  /** @type {Side} */
  const receiver = rng() < 0.5 ? 'home' : 'away';
  return {
    id: `m-${fixture.id}`, fixtureId: fixture.id, homeId: fixture.homeId, awayId: fixture.awayId, neutral: fixture.neutral,
    playoff: opts.playoff, verbose: opts.verbose, score: { home: 0, away: 0 }, quarter: 1, clock: LEAGUE_RULES.QUARTER_SECONDS,
    possession: receiver, secondHalfReceiver: otherSide(receiver), ballOn: 25, down: 1, toGo: 10, status: { kind: 'LIVE' },
    energy, stats: {}, injuries: [], plays: 0, lastText: 'Kickoff!',
    events: [{ type: 'PERIOD', quarter: 1, clock: LEAGUE_RULES.QUARTER_SECONDS, teamId: null, text: '🏟️ Kickoff! Começa a partida.' }],
  };
}

function pushEvent(m, ev) {
  const full = { quarter: m.quarter, clock: Math.max(0, m.clock), teamId: null, ...ev };
  m.lastText = full.text;
  if ((full.type === 'PLAY' || full.type === 'PUNT') && !m.verbose) return;
  m.events.push(full);
  if (m.events.length > 220) m.events.splice(0, m.events.length - 220);
}
function addStat(m, playerId, key, value) {
  if (playerId.startsWith('ghost')) return;
  if (!m.stats[playerId]) m.stats[playerId] = emptyStats();
  m.stats[playerId][key] += value;
}
function finalizeMatch(m) {
  /** @type {Side|null} */
  const winner = m.score.home > m.score.away ? 'home' : m.score.away > m.score.home ? 'away' : null;
  m.status = { kind: 'FINAL', winner };
  pushEvent(m, { type: 'PERIOD', text: `🏁 Fim de jogo: ${m.score.home} x ${m.score.away}${winner ? '' : ' (empate)'}` });
}
function addPoints(m, side, pts) {
  m.score[side] += pts;
  if (m.quarter >= 5) finalizeMatch(m); // prorrogação: morte súbita
}
function changePossession(m, newBallOn) {
  m.possession = otherSide(m.possession);
  m.ballOn = clamp(Math.round(newBallOn), 1, 99);
  m.down = 1;
  m.toGo = Math.min(10, 100 - m.ballOn);
}
const scoreDiff = (m, side) => m.score[side] - m.score[otherSide(side)];
const teamOfSide = (ctx, side) => (side === ctx.offSide ? ctx.offTeam : ctx.defTeam);
const situation = (m) => `[${m.down}ª e ${100 - m.ballOn <= m.toGo ? 'gol' : m.toGo}]`;

function playClock(ctx, kind) {
  const { m, rng } = ctx;
  if (kind === 'STOP') return randInt(rng, 5, 8);
  if (kind === 'TURNOVER') return randInt(rng, 8, 14);
  const diff = scoreDiff(m, ctx.offSide);
  const late = m.quarter >= 4 && m.clock <= 300;
  if (late && diff < 0) return randInt(rng, 12, 20); // hurry-up
  if (late && diff > 0) return randInt(rng, 38, 44); // queimando relógio
  return randInt(rng, 28, 40);
}

/** @returns {'RUN'|'SHORT_PASS'|'DEEP_PASS'} */
function chooseScrimmagePlay(ctx, diff) {
  const { m, rng, offTeam } = ctx;
  const scheme = OFFENSIVE_SCHEMES[offTeam.tactic.offense];
  let passRate = scheme.passRate, deepShare = scheme.deepShare;
  if (m.down >= 3 && m.toGo >= 7) { passRate += 0.25; deepShare += 0.12; }
  else if (m.toGo <= 2) passRate -= 0.2;
  const late = m.quarter >= 4 && m.clock <= 420;
  if (late && diff < 0) { passRate += 0.25; deepShare += 0.1; }
  if (late && diff > 0) passRate -= 0.3;
  if (100 - m.ballOn <= 15) deepShare = 0; // red zone
  if (rng() >= clamp(passRate, 0.08, 0.95)) return 'RUN';
  return rng() < clamp(deepShare, 0, 0.8) ? 'DEEP_PASS' : 'SHORT_PASS';
}

/** @returns {'RUN'|'SHORT_PASS'|'DEEP_PASS'|'PUNT'|'FIELD_GOAL'} */
function choosePlayCall(ctx) {
  const { m, rng, offTeam, offLineup } = ctx;
  const diff = scoreDiff(m, ctx.offSide);
  const fgDistance = 100 - m.ballOn + 17;
  const maxFg = 53 + (offLineup.K[0].player.trait === 'LONG_KICK' ? 7 : 0);
  const inFgRange = fgDistance <= maxFg;
  const endOfHalf = (m.quarter === 2 || m.quarter >= 4) && m.clock <= 20;
  if (endOfHalf && inFgRange && (m.quarter === 2 || (diff >= -3 && diff <= 0))) return 'FIELD_GOAL';
  if (m.quarter >= 5 && m.down >= 3 && fgDistance <= 42) return 'FIELD_GOAL'; // chute da vitória na OT
  if (m.down === 4) {
    const late = m.quarter >= 4 && m.clock <= 360;
    const aggressive = offTeam.tactic.fourthDown === 'AGGRESSIVE';
    const desperate = late && (diff < -3 || (diff < 0 && !inFgRange));
    const shortYardage = m.toGo <= (aggressive ? 3 : 1);
    const goodField = m.ballOn >= (aggressive ? 40 : 55);
    const gamble = shortYardage && goodField && (aggressive || rng() < 0.3);
    if (desperate || gamble) return chooseScrimmagePlay(ctx, diff);
    return inFgRange ? 'FIELD_GOAL' : 'PUNT';
  }
  return chooseScrimmagePlay(ctx, diff);
}

function pickDefender(ctx, positions, weightFn = () => 1) {
  const slots = positions.flatMap((pos) => ctx.defLineup[pos]);
  return weightedPick(ctx.rng, slots, (s) => s.player.ovr * weightFn(s.player)).player;
}
function pickReceiver(ctx, deep) {
  const slots = [...ctx.offLineup.WR, ...ctx.offLineup.TE];
  return weightedPick(ctx.rng, slots, (s) => s.player.ovr
    * (s.player.position === 'TE' ? (deep ? 0.55 : 1.1) : (deep ? 1.3 : 1))
    * (s.player.trait === 'GLUE_HANDS' ? 1.15 : 1)).player;
}

function kickoff(ctx, kickingSide) {
  const { m, rng } = ctx;
  const recv = otherSide(kickingSide);
  m.possession = recv; m.ballOn = 25; m.down = 1; m.toGo = 10;
  if (rng() < 0.005) {
    const team = teamOfSide(ctx, recv);
    pushEvent(m, { type: 'TOUCHDOWN', mode: 'RETURN', teamId: team.id, text: `🏈 TOUCHDOWN de retorno de kickoff! ${team.abbr} atravessa o campo inteiro!` });
    addPoints(m, recv, 6);
    if (m.status.kind === 'FINAL') return;
    m.score[recv] += 1;
    m.possession = kickingSide; m.ballOn = 25; m.down = 1; m.toGo = 10;
  }
}

/** @param {Side} side @param {LineupSlot} kickerSlot */
function scoreTouchdown(ctx, side, kickerSlot) {
  const { m, rng } = ctx;
  addPoints(m, side, 6);
  if (m.status.kind === 'FINAL') return;
  const team = teamOfSide(ctx, side);
  const diffAfter = scoreDiff(m, side);
  const aggressive = team.tactic.fourthDown === 'AGGRESSIVE';
  const chart = m.quarter >= 4 ? (aggressive ? [-2, -5, 1, 5] : m.clock <= 180 ? [-2] : []) : [];
  if (chart.includes(diffAfter)) {
    const good = rng() < 0.48;
    if (good) m.score[side] += 2;
    pushEvent(m, { type: 'EXTRA_POINT', good, twoPoint: true, teamId: team.id, text: good ? `✌️ ${team.abbr} converte a conversão de 2 pontos!` : `❌ ${team.abbr} falha na conversão de 2 pontos.` });
  } else {
    const kEff = effectiveRating(kickerSlot, m.energy, m.quarter >= 4);
    const good = rng() < clamp(0.94 + (kEff - 75) * 0.002, 0.8, 0.99);
    if (good) m.score[side] += 1;
    else pushEvent(m, { type: 'EXTRA_POINT', good: false, twoPoint: false, teamId: team.id, text: `😬 ${kickerSlot.player.name} erra o ponto extra!` });
  }
  kickoff(ctx, side);
}

/**
 * Aplica o resultado de uma jogada de scrimmage (avanço, TD, safety, descidas).
 * @param {{kind:'RUN', runner:Player} | {kind:'PASS', passer:Player, target:Player} | {kind:'SACK'} | {kind:'INCOMPLETE', passer:Player, target:Player}} play
 */
function applyPlayResult(ctx, yards, play) {
  const { m, offTeam, defTeam } = ctx;
  const spot = m.ballOn + yards;
  if (spot >= 100) {
    const gained = 100 - m.ballOn;
    if (play.kind === 'RUN') {
      addStat(m, play.runner.id, 'td', 1);
      pushEvent(m, { type: 'TOUCHDOWN', mode: 'RUN', teamId: offTeam.id, text: `🏈 TOUCHDOWN ${offTeam.abbr}! ${play.runner.name} corre ${gained} jardas até a end zone!` });
    } else if (play.kind === 'PASS') {
      addStat(m, play.target.id, 'td', 1); addStat(m, play.passer.id, 'td', 1);
      pushEvent(m, { type: 'TOUCHDOWN', mode: 'PASS', teamId: offTeam.id, text: `🏈 TOUCHDOWN ${offTeam.abbr}! ${play.passer.name} → ${play.target.name}, passe de ${gained} jardas!` });
    }
    scoreTouchdown(ctx, ctx.offSide, ctx.offLineup.K[0]);
    return;
  }
  if (spot <= 0) {
    pushEvent(m, { type: 'SAFETY', teamId: defTeam.id, text: `🛡️ SAFETY! ${defTeam.abbr} derruba o adversário na própria end zone: +2.` });
    addPoints(m, ctx.defSide, 2);
    if (m.status.kind === 'FINAL') return;
    changePossession(m, 35);
    return;
  }
  const sit = situation(m);
  if (play.kind === 'RUN') {
    if (yards >= 20) pushEvent(m, { type: 'BIG_PLAY', yards, teamId: offTeam.id, text: `⚡ BIG PLAY! ${play.runner.name} (${offTeam.abbr}) dispara ${yards} jardas pelo chão!` });
    else pushEvent(m, { type: 'PLAY', teamId: offTeam.id, text: `${sit} ${play.runner.name} corre para ${yards} jarda${Math.abs(yards) === 1 ? '' : 's'}.` });
  } else if (play.kind === 'PASS') {
    if (yards >= 20) pushEvent(m, { type: 'BIG_PLAY', yards, teamId: offTeam.id, text: `⚡ BIG PLAY! ${play.passer.name} acha ${play.target.name} (${offTeam.abbr}) para ${yards} jardas!` });
    else pushEvent(m, { type: 'PLAY', teamId: offTeam.id, text: `${sit} ${play.passer.name} completa para ${play.target.name}, ${yards} jardas.` });
  } else if (play.kind === 'INCOMPLETE') {
    pushEvent(m, { type: 'PLAY', teamId: offTeam.id, text: `${sit} ${play.passer.name} lança para ${play.target.name}: incompleto.` });
  }
  m.ballOn = spot;
  if (play.kind !== 'INCOMPLETE' && yards >= m.toGo) { m.down = 1; m.toGo = Math.min(10, 100 - m.ballOn); return; }
  m.toGo -= yards;
  m.down += 1;
  if (m.down > 4) {
    pushEvent(m, { type: 'TURNOVER_ON_DOWNS', teamId: defTeam.id, text: `✋ Parada na 4ª descida! ${defTeam.abbr} recupera a posse.` });
    changePossession(m, 100 - m.ballOn);
  }
}

function resolveRun(ctx) {
  const { m, rng, offR, defR, offLineup, defTeam } = ctx;
  const qb = offLineup.QB[0].player;
  const runner = rng() < (qb.trait === 'ELUSIVE' ? 0.12 : 0.05) ? qb : offLineup.RB[0].player;
  const adv = (offR.rushing - defR.runDef) / 125 + ctx.synergy;
  let yards = Math.max(-4, Math.round(gauss(rng, 4.0 + adv * 14, 3.4)));
  const blitz = defTeam.tactic.defense === 'BLITZ_HEAVY';
  const breakChance = 0.035 + Math.max(0, adv) * 0.06 + (runner.trait === 'ELUSIVE' ? 0.035 : 0) + (blitz ? 0.015 : 0);
  if (rng() < breakChance) yards += randInt(rng, 12, 55);
  const fumbleChance = clamp(0.011 - adv * 0.01 - (runner.trait === 'GLUE_HANDS' ? 0.005 : 0), 0.003, 0.025);
  if (rng() < fumbleChance) {
    const spot = clamp(m.ballOn + clamp(yards, 0, 8), 1, 99);
    const forcer = pickDefender(ctx, ['LB', 'DL', 'DB']);
    addStat(m, runner.id, 'yds', spot - m.ballOn);
    pushEvent(m, { type: 'FUMBLE', teamId: defTeam.id, text: `💥 FUMBLE! ${runner.name} perde a bola e ${forcer.name} (${defTeam.abbr}) recupera!` });
    changePossession(m, 100 - spot);
    return playClock(ctx, 'TURNOVER');
  }
  addStat(m, runner.id, 'yds', Math.min(yards, 100 - m.ballOn));
  applyPlayResult(ctx, yards, { kind: 'RUN', runner });
  return playClock(ctx, 'NORMAL');
}

function resolvePass(ctx, deep) {
  const { m, rng, offR, defR, offLineup, offTeam, defTeam } = ctx;
  const qb = offLineup.QB[0].player;
  const blitz = defTeam.tactic.defense === 'BLITZ_HEAVY';
  const cover2 = defTeam.tactic.defense === 'COVER_2_ZONE';
  // 1) Pressão / sack
  const pressure = defR.passRush / Math.max(30, offR.passBlock);
  let sackChance = 0.06 * pressure * pressure * (blitz ? 1.6 : 1) * (deep ? 1.25 : 0.8) * (qb.trait === 'ELUSIVE' ? 0.7 : 1);
  if (offTeam.tactic.offense === 'WEST_COAST') sackChance *= 0.8;
  if (rng() < clamp(sackChance, 0.015, 0.2)) {
    const sacker = pickDefender(ctx, ['DL', 'LB'], (p) => (p.trait === 'PASS_RUSHER' ? 2.2 : 1));
    const loss = randInt(rng, 3, 9);
    addStat(m, sacker.id, 'sacks', 1);
    addStat(m, qb.id, 'yds', -loss);
    pushEvent(m, { type: 'SACK', teamId: defTeam.id, text: `🧱 SACK! ${sacker.name} (${defTeam.abbr}) derruba ${qb.name}: perda de ${loss} jardas.` });
    applyPlayResult(ctx, -loss, { kind: 'SACK' });
    return playClock(ctx, 'NORMAL');
  }
  // 2) Interceptação
  const coverageRatio = defR.coverage / Math.max(30, offR.passing);
  let intChance = (deep ? 0.04 : 0.015) * coverageRatio * coverageRatio * (cover2 && deep ? 1.3 : 1) * (offTeam.tactic.offense === 'AIR_RAID' ? 1.15 : 1);
  if (qb.trait === 'CLUTCH' && m.quarter >= 4) intChance *= 0.75;
  if (rng() < clamp(intChance, 0.005, 0.09)) {
    const picker = pickDefender(ctx, ['DB', 'LB'], (p) => (p.position === 'DB' ? 2 : 1) * (p.trait === 'LOCKDOWN' ? 1.8 : 1));
    addStat(m, picker.id, 'ints', 1);
    const air = deep ? randInt(rng, 15, 35) : randInt(rng, 4, 12);
    const spot = clamp(m.ballOn + air, 1, 99);
    const ret = rng() < 0.05 ? 100 : randInt(rng, 0, 25);
    const defBallOn = 100 - spot + ret;
    if (defBallOn >= 100) {
      addStat(m, picker.id, 'td', 1);
      pushEvent(m, { type: 'TOUCHDOWN', mode: 'RETURN', teamId: defTeam.id, text: `🏈 PICK-SIX! ${picker.name} (${defTeam.abbr}) intercepta ${qb.name} e volta até a end zone!` });
      scoreTouchdown(ctx, ctx.defSide, ctx.defLineup.K[0]);
    } else {
      pushEvent(m, { type: 'INTERCEPTION', teamId: defTeam.id, text: `🖐️ INTERCEPTAÇÃO! ${picker.name} (${defTeam.abbr}) rouba o passe de ${qb.name}!` });
      changePossession(m, defBallOn);
    }
    return playClock(ctx, 'TURNOVER');
  }
  // 3) Passe completo / incompleto
  const target = pickReceiver(ctx, deep);
  const adv = (offR.passing - defR.coverage) / 125 + ctx.synergy;
  const lockdowns = ctx.defLineup.DB.filter((s) => s.player.trait === 'LOCKDOWN').length;
  let comp = (deep ? 0.42 : 0.67) + adv * 0.6 + (target.trait === 'GLUE_HANDS' ? 0.06 : 0)
    + (deep && qb.trait === 'CANNON_ARM' ? 0.06 : 0) - lockdowns * 0.03 - (blitz ? 0.03 : 0) - (cover2 && deep ? 0.06 : 0);
  if (rng() >= clamp(comp, 0.15, 0.9)) {
    applyPlayResult(ctx, 0, { kind: 'INCOMPLETE', passer: qb, target });
    return playClock(ctx, 'STOP');
  }
  let yards = deep
    ? Math.max(12, Math.round(gauss(rng, 22 + adv * 20 + (qb.trait === 'CANNON_ARM' ? 4 : 0), 8)))
    : Math.max(-2, Math.round(gauss(rng, 6.5 + adv * 10, 3.5)));
  const yacChance = (deep ? 0.08 : 0.04) + (target.trait === 'ELUSIVE' ? 0.03 : 0) + (blitz ? 0.025 : 0) + Math.max(0, adv) * 0.05;
  if (rng() < yacChance) yards += randInt(rng, 10, 45);
  const credited = Math.min(yards, 100 - m.ballOn);
  addStat(m, qb.id, 'yds', credited); addStat(m, target.id, 'yds', credited);
  applyPlayResult(ctx, yards, { kind: 'PASS', passer: qb, target });
  return playClock(ctx, 'NORMAL');
}

function resolvePunt(ctx) {
  const { m, rng, offTeam } = ctx;
  const net = clamp(Math.round(gauss(rng, 41, 7)), 25, 60);
  const landing = m.ballOn + net;
  pushEvent(m, { type: 'PUNT', teamId: offTeam.id, text: `${situation(m)} ${offTeam.abbr} punta: ${net} jardas${landing >= 100 ? ' (touchback)' : ''}.` });
  changePossession(m, landing >= 100 ? 20 : 100 - landing);
  return randInt(rng, 6, 9);
}

function resolveFieldGoal(ctx) {
  const { m, rng, offLineup, offTeam } = ctx;
  const slot = offLineup.K[0];
  const kicker = slot.player;
  const distance = 100 - m.ballOn + 17;
  const kEff = effectiveRating(slot, m.energy, m.quarter >= 4);
  let p = 1.0 - Math.max(0, distance - 22) * 0.011 + (kEff - 75) * 0.006;
  if (kicker.trait === 'LONG_KICK' && distance >= 45) p += 0.08;
  if (kicker.trait === 'CLUTCH' && m.quarter >= 4) p += 0.04;
  if (rng() < clamp(p, 0.05, 0.99)) {
    addStat(m, kicker.id, 'fg', 1);
    pushEvent(m, { type: 'FIELD_GOAL', good: true, distance, teamId: offTeam.id, text: `🎯 FIELD GOAL! ${kicker.name} (${offTeam.abbr}) acerta de ${distance} jardas.` });
    addPoints(m, ctx.offSide, 3);
    if (m.status.kind !== 'FINAL') kickoff(ctx, ctx.offSide);
  } else {
    pushEvent(m, { type: 'FIELD_GOAL', good: false, distance, teamId: offTeam.id, text: `🚫 ${kicker.name} (${offTeam.abbr}) erra o field goal de ${distance} jardas!` });
    changePossession(m, Math.max(20, 100 - (m.ballOn - 7)));
  }
  return randInt(rng, 5, 8);
}

function applyFatigue(ctx, call) {
  const { m, offLineup, defLineup, offTeam, defTeam } = ctx;
  const drain = (p, amount) => { if (!isGhost(p)) m.energy[p.id] = Math.max(0, energyOf(p, m.energy) - amount); };
  if (call === 'PUNT' || call === 'FIELD_GOAL') { drain(offLineup.K[0].player, 1.5); return; }
  const groundGame = offTeam.tactic.offense === 'GROUND_AND_POUND';
  const blitz = defTeam.tactic.defense === 'BLITZ_HEAVY';
  for (const pos of OFFENSE_UNIT) {
    const base = pos === 'QB' ? (groundGame ? 0.13 : 0.26)
      : pos === 'RB' ? (call === 'RUN' ? 0.8 : 0.3)
      : pos === 'WR' ? (call === 'RUN' ? 0.18 : 0.48) : 0.38;
    offLineup[pos].forEach((s) => drain(s.player, base));
  }
  for (const pos of DEFENSE_UNIT) defLineup[pos].forEach((s) => drain(s.player, 0.36 * (blitz && pos !== 'DB' ? 1.35 : 1)));
}

function rollInjury(ctx) {
  const { m, rng } = ctx;
  if (rng() >= 0.0028) return;
  const pool = [...OFFENSE_UNIT.flatMap((pos) => ctx.offLineup[pos]), ...DEFENSE_UNIT.flatMap((pos) => ctx.defLineup[pos])]
    .map((s) => s.player).filter((p) => !isGhost(p) && !m.injuries.some((i) => i.playerId === p.id));
  if (!pool.length) return;
  const victim = pickOne(rng, pool);
  const weeks = rng() < 0.08 ? randInt(rng, 4, 6) : randInt(rng, 1, 3);
  m.injuries.push({ playerId: victim.id, weeks });
  const team = victim.teamId === ctx.offTeam.id ? ctx.offTeam : ctx.defTeam;
  pushEvent(m, { type: 'INJURY', playerId: victim.id, teamId: team.id, text: `🚑 Lesão: ${victim.name} (${team.abbr}, ${victim.position}) sai machucado — ${weeks} semana${weeks > 1 ? 's' : ''} fora.` });
}

function advanceClock(m, used, rng) {
  m.clock -= used;
  if (m.clock > 0) return;
  const q = m.quarter;
  if (q === 1 || q === 3) {
    pushEvent(m, { type: 'PERIOD', text: `⏱️ Fim do ${q}º quarto: ${m.score.home} x ${m.score.away}` });
    m.quarter += 1; m.clock = LEAGUE_RULES.QUARTER_SECONDS;
    return;
  }
  if (q === 2) {
    pushEvent(m, { type: 'PERIOD', text: `☕ INTERVALO: ${m.score.home} x ${m.score.away}` });
    m.quarter = 3; m.clock = LEAGUE_RULES.QUARTER_SECONDS;
    m.possession = m.secondHalfReceiver; m.ballOn = 25; m.down = 1; m.toGo = 10;
    return;
  }
  if (q === 4 && m.score.home !== m.score.away) { finalizeMatch(m); return; }
  if (q >= 5 && !m.playoff) { finalizeMatch(m); return; }
  if (q >= 8) {
    // Salvaguarda de playoffs: após 4 prorrogações decide-se num chute de desempate.
    const side = rng() < 0.5 ? 'home' : 'away';
    m.score[side] += 3;
    pushEvent(m, { type: 'FIELD_GOAL', good: true, distance: 50, teamId: side === 'home' ? m.homeId : m.awayId, text: '🎯 Chute de desempate decide o confronto!' });
    finalizeMatch(m);
    return;
  }
  m.quarter += 1; m.clock = LEAGUE_RULES.OT_SECONDS;
  m.possession = rng() < 0.5 ? 'home' : 'away'; m.ballOn = 25; m.down = 1; m.toGo = 10;
  pushEvent(m, { type: 'PERIOD', text: `🪙 ${quarterLabel(m.quarter)}! Prorrogação com morte súbita.` });
}

/**
 * Simula UMA jogada da partida. Pura: não muta `match`, retorna novo estado.
 * @param {{team:Team, roster:Player[], autoSub:boolean}} home
 * @param {{team:Team, roster:Player[], autoSub:boolean}} away
 * @param {MatchState} match @param {() => number} rng
 * @returns {MatchState}
 */
function simulateMatchTick(home, away, match, rng) {
  if (match.status.kind === 'FINAL') return match;
  const m = structuredClone(match);
  const offSide = m.possession, defSide = otherSide(offSide);
  const off = offSide === 'home' ? home : away;
  const def = offSide === 'home' ? away : home;
  const clutch = m.quarter >= 4;
  const offLineup = selectLineup(off.roster, m.energy, m.injuries, off.autoSub);
  const defLineup = selectLineup(def.roster, m.energy, m.injuries, def.autoSub);
  const ctx = {
    m, rng, offSide, defSide, offTeam: off.team, defTeam: def.team, offLineup, defLineup,
    offR: calculateUnitStrength(offLineup, off.team.tactic, m.energy, clutch),
    defR: calculateUnitStrength(defLineup, def.team.tactic, m.energy, clutch),
    synergy: tacticalSynergy(off.team.tactic.offense, def.team.tactic.defense),
  };
  const call = choosePlayCall(ctx);
  const clockUsed = call === 'RUN' ? resolveRun(ctx)
    : call === 'SHORT_PASS' ? resolvePass(ctx, false)
    : call === 'DEEP_PASS' ? resolvePass(ctx, true)
    : call === 'PUNT' ? resolvePunt(ctx)
    : resolveFieldGoal(ctx);
  applyFatigue(ctx, call);
  rollInjury(ctx);
  m.plays += 1;
  if (m.status.kind !== 'FINAL') advanceClock(m, clockUsed, rng);
  return m;
}

// --- 2.7 Offseason: envelhecimento, aposentadoria, draft ---------------------------
/**
 * @param {Record<string, Player>} players @param {() => number} rng
 * @returns {{ players: Record<string, Player>, retired: Player[] }}
 */
function processOffseasonAging(players, rng) {
  /** @type {Record<string, Player>} */
  const out = {};
  const retired = [];
  for (const p0 of Object.values(players)) {
    const p = { ...p0, stats: emptyStats() };
    p.age += 1;
    const delta = p.age <= 24 ? randInt(rng, 1, 5) : p.age <= 27 ? randInt(rng, 0, 3) : p.age <= 30 ? randInt(rng, -1, 1)
      : p.age <= 32 ? randInt(rng, -3, 0) : randInt(rng, -6, -2);
    p.ovr = clamp(p.ovr + delta, 40, 99);
    const retire = p.age >= 38 || (p.age >= 34 && rng() < 0.25 + (p.age - 34) * 0.15) || (p.age >= 31 && p.ovr < 55);
    if (retire) { retired.push(p); continue; }
    p.salary = round1(Math.max(0.6, 0.5 * p.salary + 0.5 * salaryFor(p.ovr, p.position)));
    p.energy = 100; p.injuryWeeks = 0; p.morale = Math.round((p.morale + 60) / 2);
    out[p.id] = p;
  }
  return { players: out, retired };
}

/** Ordem inversa da classificação; campeão escolhe por último, vice em 15º. */
function computeDraftOrder(teams, teamOrder, championId, runnerUpId) {
  const ids = computeStandings(teams, teamOrder).map((r) => r.team.id).reverse()
    .filter((id) => id !== championId && id !== runnerUpId);
  return [...ids, runnerUpId, championId];
}

/** Escolha da IA: melhor OVR ajustado pela carência da posição. */
function aiDraftChoice(prospects, roster) {
  const count = (pos) => roster.filter((p) => p.position === pos).length;
  const score = (p) => {
    const need = ROSTER_TEMPLATE[p.position] - count(p.position);
    return p.ovr + (need > 0 ? 6 * need : -4) + (p.position === 'K' && count('K') > 0 ? -15 : 0) + (23 - p.age) * 0.5;
  };
  return [...prospects].sort((a, b) => score(b) - score(a))[0];
}

// --- 2.8 Consultas derivadas --------------------------------------------------------
/** @param {GameState} state */
const rosterOf = (state, teamId) => Object.values(state.players).filter((p) => p.teamId === teamId);
const isPlayablePhase = (phase) => ['REGULAR_SEASON', 'PLAYOFFS_DIVISIONAL', 'PLAYOFFS_CONFERENCE', 'SUPER_BOWL'].includes(phase.kind);
/** @param {GameState} state @returns {Fixture[]} */
function currentFixtures(state) {
  const ph = state.phase;
  if (ph.kind === 'REGULAR_SEASON') return state.schedule.filter((f) => f.week === ph.week);
  if (ph.kind === 'PLAYOFFS_DIVISIONAL' || ph.kind === 'PLAYOFFS_CONFERENCE' || ph.kind === 'SUPER_BOWL') return ph.fixtures;
  return [];
}
function phaseLabel(phase, year) {
  if (phase.kind === 'REGULAR_SEASON') return `Temporada ${year} · Semana ${phase.week}/${LEAGUE_RULES.REGULAR_SEASON_WEEKS}`;
  if (phase.kind === 'OFFSEASON_DRAFT') return `Offseason ${year} · NFL Draft`;
  return `Temporada ${year} · ${PHASE_LABELS[phase.kind]}`;
}
const draftComplete = (ph) => ph.kind === 'OFFSEASON_DRAFT' && ph.pickIndex >= ph.order.length * ph.rounds;
const draftCurrentTeam = (ph) => ph.order[ph.pickIndex % ph.order.length];
/** @param {GameState} state */
const availableProspects = (state) => (state.phase.kind === 'OFFSEASON_DRAFT'
  ? state.phase.prospectIds.map((id) => state.players[id]).filter((p) => p && p.teamId === null) : []);
const isFreeAgent = (state, p) => p.teamId === null && !(state.phase.kind === 'OFFSEASON_DRAFT' && state.phase.prospectIds.includes(p.id));
/** Jogador lesionado durante a rodada ao vivo (ainda não consolidado). */
const injuredInLive = (state, playerId) => !!state.liveRound && state.liveRound.matches.some((m) => m.injuries.some((i) => i.playerId === playerId));

// =====================================================================================
// === 3. STATE & STORE ================================================================
// 3a. Reducer puro: (state, action, env) → novo state. `env.rng` é a única fonte de
//     aleatoriedade. Ações de "rascunho" clonam o estado (estilo Immer) e mutam a cópia;
//     o estado recebido nunca é alterado.
// 3b. Store runtime: único ponto com efeitos colaterais (localStorage, assinantes).
// =====================================================================================

// --- 3a.1 Criação de jogo -----------------------------------------------------------
function makeIdGen(holder) { return () => `p${holder.nextId++}`; }

/** @param {GameState} s */
function pushNews(s, text, kind = 'info') {
  const label = s.phase.kind === 'REGULAR_SEASON' ? `Sem. ${s.phase.week}` : PHASE_LABELS[s.phase.kind];
  s.news.unshift({ id: `n${s.nextId++}`, year: s.seasonYear, label, text, kind });
  if (s.news.length > 60) s.news.length = 60;
}
function pushLedger(s, label, income, expense) {
  s.ledger.unshift({ label, income: round1(income), expense: round1(expense) });
  if (s.ledger.length > 40) s.ledger.length = 40;
}

/** Aplica escalação automática (flags `starter`) num rascunho. */
function applyAutoLineup(s, teamId) {
  const roster = rosterOf(s, teamId);
  const ids = autoLineupIds(roster);
  roster.forEach((p) => { p.starter = ids.has(p.id); });
}
/** Completa somente as vagas abertas, preservando as escolhas do usuário. */
function fillLineupGaps(s, teamId) {
  const roster = rosterOf(s, teamId);
  for (const pos of POSITIONS) {
    const atPos = roster.filter((p) => p.position === pos);
    atPos.filter((p) => p.starter && p.injuryWeeks > 0).forEach((p) => { p.starter = false; });
    let open = STARTER_SLOTS[pos] - atPos.filter((p) => p.starter).length;
    const bench = atPos.filter((p) => !p.starter && p.injuryWeeks === 0).sort((a, b) => b.ovr - a.ovr);
    while (open > 0 && bench.length) { bench.shift().starter = true; open -= 1; }
  }
}
function prepareAiTeams(s) {
  for (const id of s.teamOrder) {
    if (id === s.userTeamId) continue;
    applyAutoLineup(s, id);
    s.teams[id].tactic = chooseAiTactic(rosterOf(s, id));
  }
}

/** @returns {GameState} */
function createNewGame(userTeamId, rng) {
  const holder = { nextId: 1 };
  const nextId = makeIdGen(holder);
  /** @type {Record<string, Team>} */
  const teams = {};
  /** @type {Record<string, Player>} */
  const players = {};
  for (const seed of TEAM_SEEDS) {
    teams[seed.id] = {
      id: seed.id, city: seed.city, name: seed.name, abbr: seed.id, conference: /** @type {Conference} */ (seed.conference),
      colors: { primary: seed.primary, secondary: seed.secondary }, tactic: { offense: 'BALANCED', defense: 'BALANCED', fourthDown: 'CONSERVATIVE' },
      cash: LEAGUE_RULES.STARTING_CASH, fanBase: seed.fans, record: emptyRecord(),
    };
    generateTeamRoster(rng, nextId, seed.id, seed.base).forEach((p) => { players[p.id] = p; });
  }
  generateFreeAgents(rng, nextId, 28).forEach((p) => { players[p.id] = p; });
  const teamOrder = TEAM_SEEDS.map((t) => t.id);
  /** @type {GameState} */
  const s = {
    version: LEAGUE_RULES.SAVE_VERSION, seasonYear: LEAGUE_RULES.FIRST_SEASON, userTeamId, teams, teamOrder, players,
    schedule: generateSchedule(teamOrder, LEAGUE_RULES.REGULAR_SEASON_WEEKS, rng), phase: { kind: 'REGULAR_SEASON', week: 1 },
    liveRound: null, boardMorale: LEAGUE_RULES.STARTING_BOARD, news: [], ledger: [], history: [], playoffResults: [], nextId: holder.nextId,
  };
  teamOrder.forEach((id) => applyAutoLineup(s, id));
  prepareAiTeams(s);
  s.teams[userTeamId].tactic = chooseAiTactic(rosterOf(s, userTeamId));
  const t = s.teams[userTeamId];
  pushNews(s, `Bem-vindo ao comando do ${t.city} ${t.name}! A diretoria espera playoffs nesta temporada.`, 'good');
  return s;
}

// --- 3a.2 Validação (pura, compartilhada por reducer e UI) --------------------------
/**
 * Retorna mensagem de erro ou null se a ação é válida no estado atual.
 * @param {GameState|null} state @param {GameAction} action @returns {string|null}
 */
function validateAction(state, action) {
  if (action.type === 'NEW_GAME') return TEAM_SEEDS.some((t) => t.id === action.userTeamId) ? null : 'Franquia inválida.';
  if (!state) return 'Nenhum jogo em andamento.';
  if (state.phase.kind === 'GAME_OVER') return 'Você foi demitido. Inicie um novo jogo.';
  const user = state.userTeamId;
  const ph = state.phase;
  const p = 'playerId' in action ? state.players[action.playerId] : undefined;
  const roster = rosterOf(state, user);
  const cap = processSalaryCap(state.teams[user], roster);
  const cash = state.teams[user].cash;
  switch (action.type) {
    case 'TOGGLE_STARTER':
      if (!p || p.teamId !== user) return 'Jogador não pertence ao seu elenco.';
      if (!p.starter && (p.injuryWeeks > 0 || injuredInLive(state, p.id))) return `${p.name} está lesionado.`;
      return null;
    case 'SWAP_STARTER': {
      const pin = state.players[action.inId], pout = state.players[action.outId];
      if (!pin || !pout || pin.teamId !== user || pout.teamId !== user) return 'Substituição inválida.';
      if (pin.position !== pout.position) return 'Os jogadores precisam ser da mesma posição.';
      if (pin.starter || !pout.starter) return 'Substituição inválida.';
      if (pin.injuryWeeks > 0 || injuredInLive(state, pin.id)) return `${pin.name} está lesionado.`;
      return null;
    }
    case 'AUTO_LINEUP': return null;
    case 'SET_TACTIC': {
      const valid = { offense: OFFENSIVE_SCHEMES, defense: DEFENSIVE_SCHEMES, fourthDown: FOURTH_DOWN_POSTURES };
      return valid[action.field] && action.value in valid[action.field] ? null : 'Tática inválida.';
    }
    case 'SIGN_FREE_AGENT':
      if (state.liveRound) return 'Mercado fechado durante a rodada.';
      if (!p || !isFreeAgent(state, p)) return 'Jogador indisponível.';
      if (roster.length >= LEAGUE_RULES.MAX_ROSTER) return `Elenco cheio (máx. ${LEAGUE_RULES.MAX_ROSTER}).`;
      if (cap.payroll + p.salary > LEAGUE_RULES.SALARY_CAP) return `Estoura o Salary Cap (espaço: $${cap.capSpace.toFixed(1)}M).`;
      if (cash < signingBonus(p)) return `Caixa insuficiente para as luvas ($${signingBonus(p).toFixed(1)}M).`;
      return null;
    case 'BUY_PLAYER': {
      if (state.liveRound) return 'Mercado fechado durante a rodada.';
      if (!p || !p.teamId || p.teamId === user) return 'Jogador indisponível.';
      const seller = rosterOf(state, p.teamId);
      if (roster.length >= LEAGUE_RULES.MAX_ROSTER) return `Elenco cheio (máx. ${LEAGUE_RULES.MAX_ROSTER}).`;
      if (cap.payroll + p.salary > LEAGUE_RULES.SALARY_CAP) return `Estoura o Salary Cap (espaço: $${cap.capSpace.toFixed(1)}M).`;
      if (cash < marketValue(p)) return `Caixa insuficiente: custa $${marketValue(p).toFixed(1)}M.`;
      if (seller.filter((x) => x.position === p.position).length <= STARTER_SLOTS[p.position]) return `${state.teams[p.teamId].abbr} não negocia: sem reposição na posição.`;
      if (seller.length <= LEAGUE_RULES.MIN_ROSTER) return `${state.teams[p.teamId].abbr} não pode reduzir o elenco.`;
      return null;
    }
    case 'RELEASE_PLAYER':
      if (state.liveRound) return 'Mercado fechado durante a rodada.';
      if (!p || p.teamId !== user) return 'Jogador não pertence ao seu elenco.';
      if (roster.length <= LEAGUE_RULES.MIN_ROSTER) return `Elenco mínimo de ${LEAGUE_RULES.MIN_ROSTER} jogadores.`;
      if (roster.filter((x) => x.position === p.position).length <= STARTER_SLOTS[p.position]) return `Mantenha pelo menos ${STARTER_SLOTS[p.position]} ${p.position}.`;
      if (cash < releaseCost(p)) return `Caixa insuficiente para a multa rescisória ($${releaseCost(p).toFixed(1)}M).`;
      return null;
    case 'START_WEEK': {
      if (state.liveRound) return 'A rodada já está em andamento.';
      if (!isPlayablePhase(ph)) return 'Não há jogos nesta fase.';
      const plays = currentFixtures(state).some((f) => f.homeId === user || f.awayId === user);
      if (plays) {
        const v = lineupValidation(roster);
        if (!v.ok) return `Escalação incompleta: ${v.rows.filter((r) => r.blocking).map((r) => `${r.pos} ${r.filled}/${r.required}`).join(', ')}. Use "Escalação Automática".`;
      }
      return null;
    }
    case 'SIM_TICK': case 'SIM_TO_END':
      return state.liveRound ? null : 'Nenhuma rodada em andamento.';
    case 'FINISH_WEEK':
      if (!state.liveRound) return 'Nenhuma rodada em andamento.';
      return state.liveRound.matches.every((m) => m.status.kind === 'FINAL') ? null : 'Ainda há jogos em andamento.';
    case 'START_OFFSEASON': return ph.kind === 'SEASON_RECAP' ? null : 'A temporada ainda não acabou.';
    case 'DRAFT_PICK':
      if (ph.kind !== 'OFFSEASON_DRAFT' || draftComplete(ph)) return 'Draft indisponível.';
      if (draftCurrentTeam(ph) !== user) return 'Não é a sua vez de escolher.';
      if (!p || p.teamId !== null || !ph.prospectIds.includes(p.id)) return 'Prospecto indisponível.';
      return null;
    case 'DRAFT_SIM_TO_USER':
      if (ph.kind !== 'OFFSEASON_DRAFT' || draftComplete(ph)) return 'Draft indisponível.';
      return draftCurrentTeam(ph) === user ? 'É a sua vez de escolher!' : null;
    case 'START_NEW_SEASON': return draftComplete(ph) ? null : 'Conclua o draft primeiro.';
    default: return 'Ação desconhecida.';
  }
}

// --- 3a.3 Gestão automática de elencos (IA) -----------------------------------------
function releaseToMarket(s, p) { p.teamId = null; p.starter = false; }

function signBestFreeAgent(s, teamId, pos) {
  const roster = rosterOf(s, teamId);
  if (roster.length >= LEAGUE_RULES.MAX_ROSTER) return null;
  const space = LEAGUE_RULES.SALARY_CAP - processSalaryCap(s.teams[teamId], roster).payroll;
  const fa = Object.values(s.players).filter((p) => isFreeAgent(s, p) && p.position === pos && p.salary <= space)
    .sort((a, b) => b.ovr - a.ovr)[0];
  if (!fa) return null;
  fa.teamId = teamId; fa.starter = false; fa.morale = 65;
  return fa;
}

/** Reposição semanal: preenche posições sem titulares saudáveis. */
function aiWeeklyMaintenance(s) {
  for (const id of s.teamOrder) {
    if (id === s.userTeamId) continue;
    for (const pos of POSITIONS) {
      let guard = 3;
      while (guard-- > 0 && rosterOf(s, id).filter((p) => p.position === pos && p.injuryWeeks === 0).length < STARTER_SLOTS[pos]) {
        if (rosterOf(s, id).length >= LEAGUE_RULES.MAX_ROSTER) {
          const surplus = rosterOf(s, id).filter((p) => rosterOf(s, id).filter((x) => x.position === p.position).length > ROSTER_TEMPLATE[p.position])
            .sort((a, b) => a.ovr - b.ovr)[0];
          if (!surplus) break;
          releaseToMarket(s, surplus);
        }
        if (!signBestFreeAgent(s, id, pos)) break;
      }
    }
  }
}

/** Reestruturação de offseason: elenco máximo, teto salarial e profundidade-alvo. */
function aiOffseasonRoster(s, teamId) {
  const depthOk = (p) => rosterOf(s, teamId).filter((x) => x.position === p.position).length > STARTER_SLOTS[p.position];
  let guard = 40;
  while (guard-- > 0 && rosterOf(s, teamId).length > LEAGUE_RULES.MAX_ROSTER) {
    const worst = rosterOf(s, teamId).filter(depthOk).sort((a, b) => (a.ovr - Math.max(0, a.age - 30) * 2) - (b.ovr - Math.max(0, b.age - 30) * 2))[0];
    if (!worst) break;
    releaseToMarket(s, worst);
  }
  guard = 40;
  while (guard-- > 0 && processSalaryCap(s.teams[teamId], rosterOf(s, teamId)).overCap) {
    const pricey = rosterOf(s, teamId).filter(depthOk).sort((a, b) => b.salary / b.ovr - a.salary / a.ovr)[0];
    if (!pricey) break;
    releaseToMarket(s, pricey);
  }
  for (const pos of POSITIONS) {
    let g = 4;
    while (g-- > 0 && rosterOf(s, teamId).filter((p) => p.position === pos).length < ROSTER_TEMPLATE[pos]) {
      if (!signBestFreeAgent(s, teamId, pos)) break;
    }
  }
  // Reforços: usa o espaço no teto para trocar titulares fracos por free agents melhores.
  let upgrades = 3;
  const market = Object.values(s.players).filter((p) => isFreeAgent(s, p)).sort((a, b) => b.ovr - a.ovr);
  for (const fa of market) {
    if (upgrades <= 0) break;
    if (fa.teamId !== null) continue;
    const roster = rosterOf(s, teamId);
    const atPos = roster.filter((p) => p.position === fa.position).sort((a, b) => b.ovr - a.ovr);
    const weakestStarter = atPos[Math.min(STARTER_SLOTS[fa.position], atPos.length) - 1];
    if (!weakestStarter || fa.ovr < weakestStarter.ovr + 3) continue;
    const space = LEAGUE_RULES.SALARY_CAP - processSalaryCap(s.teams[teamId], roster).payroll;
    const cut = atPos.length > STARTER_SLOTS[fa.position] ? atPos[atPos.length - 1] : null;
    const freed = roster.length >= LEAGUE_RULES.MAX_ROSTER ? (cut ? cut.salary : Infinity) : 0;
    if (fa.salary > space + (Number.isFinite(freed) ? freed : 0) || !Number.isFinite(freed)) continue;
    if (roster.length >= LEAGUE_RULES.MAX_ROSTER && cut) releaseToMarket(s, cut);
    fa.teamId = teamId; fa.starter = false; fa.morale = 65;
    upgrades -= 1;
  }
}

// --- 3a.4 Rodada ao vivo ------------------------------------------------------------
/** @param {GameState} state @param {() => number} rng @returns {GameState} */
function startWeek(state, rng) {
  const s = structuredClone(state);
  prepareAiTeams(s);
  const playoff = s.phase.kind !== 'REGULAR_SEASON';
  const matches = currentFixtures(s).map((f) => createMatchState(f, rosterOf(s, f.homeId), rosterOf(s, f.awayId),
    { verbose: f.homeId === s.userTeamId || f.awayId === s.userTeamId, playoff }, rng));
  // Garante que o jogo do usuário seja o destaque (primeiro da lista).
  matches.sort((a, b) => Number(b.verbose) - Number(a.verbose));
  s.liveRound = { matches };
  return s;
}

/** Um tick = uma jogada em cada partida ainda viva. @param {GameState} state */
function simRoundTick(state, rng) {
  const byTeam = {};
  for (const p of Object.values(state.players)) if (p.teamId) (byTeam[p.teamId] ||= []).push(p);
  const side = (id) => ({ team: state.teams[id], roster: byTeam[id] || [], autoSub: id !== state.userTeamId });
  const matches = state.liveRound.matches.map((m) => simulateMatchTick(side(m.homeId), side(m.awayId), m, rng));
  return { ...state, liveRound: { ...state.liveRound, matches } };
}

function findFixture(s, fixtureId) {
  const ph = s.phase;
  if (ph.kind === 'REGULAR_SEASON') return s.schedule.find((f) => f.id === fixtureId);
  if ('fixtures' in ph) return ph.fixtures.find((f) => f.id === fixtureId);
  return undefined;
}
const fixtureWinner = (f) => (f.result.home > f.result.away ? f.homeId : f.awayId);
const fixtureLoser = (f) => (f.result.home > f.result.away ? f.awayId : f.homeId);

function makePlayoffFixture(id, week, homeId, awayId, neutral = false) {
  return { id, week, homeId, awayId, neutral, result: null };
}

/** Transições da máquina de estados após o fim de uma rodada. @param {GameState} s */
function advancePhase(s) {
  const ph = s.phase;
  const user = s.userTeamId;
  const name = (id) => `${s.teams[id].city} ${s.teams[id].name}`;
  if (ph.kind === 'REGULAR_SEASON') {
    if (ph.week < LEAGUE_RULES.REGULAR_SEASON_WEEKS) { s.phase = { kind: 'REGULAR_SEASON', week: ph.week + 1 }; return; }
    const seedOf = (conf) => computeStandings(s.teams, s.teamOrder.filter((id) => s.teams[id].conference === conf)).slice(0, LEAGUE_RULES.PLAYOFF_SEEDS).map((r) => r.team.id);
    const seeds = { AFC: seedOf('AFC'), NFC: seedOf('NFC') };
    const fixtures = ['AFC', 'NFC'].flatMap((c) => [
      makePlayoffFixture(`po-div-${c}-1`, 15, seeds[c][0], seeds[c][3]),
      makePlayoffFixture(`po-div-${c}-2`, 15, seeds[c][1], seeds[c][2]),
    ]);
    s.phase = { kind: 'PLAYOFFS_DIVISIONAL', seeds, fixtures };
    const made = seeds.AFC.includes(user) || seeds.NFC.includes(user);
    s.boardMorale = clamp(s.boardMorale + (made ? 10 : -15), 0, 100);
    pushNews(s, made ? '🎉 Classificados para os PLAYOFFS! A diretoria está satisfeita.' : '😞 Fora dos playoffs. A diretoria cobra resultados.', made ? 'good' : 'bad');
    pushNews(s, `Playoffs definidos — AFC: ${seeds.AFC.join(', ')} · NFC: ${seeds.NFC.join(', ')}`);
    return;
  }
  if (ph.kind === 'PLAYOFFS_DIVISIONAL') {
    const fixtures = ['AFC', 'NFC'].map((c) => {
      const w1 = fixtureWinner(ph.fixtures.find((f) => f.id === `po-div-${c}-1`));
      const w2 = fixtureWinner(ph.fixtures.find((f) => f.id === `po-div-${c}-2`));
      const [home, away] = ph.seeds[c].indexOf(w1) < ph.seeds[c].indexOf(w2) ? [w1, w2] : [w2, w1];
      return makePlayoffFixture(`po-conf-${c}`, 16, home, away);
    });
    s.phase = { kind: 'PLAYOFFS_CONFERENCE', seeds: ph.seeds, fixtures };
    pushNews(s, `Finais de Conferência: ${fixtures.map((f) => `${f.awayId} @ ${f.homeId}`).join(' · ')}`);
    return;
  }
  if (ph.kind === 'PLAYOFFS_CONFERENCE') {
    const afc = fixtureWinner(ph.fixtures.find((f) => f.id === 'po-conf-AFC'));
    const nfc = fixtureWinner(ph.fixtures.find((f) => f.id === 'po-conf-NFC'));
    const [home, away] = s.seasonYear % 2 === 0 ? [afc, nfc] : [nfc, afc];
    s.phase = { kind: 'SUPER_BOWL', seeds: ph.seeds, fixtures: [makePlayoffFixture('po-sb', 17, home, away, true)] };
    pushNews(s, `🏟️ SUPER BOWL definido: ${name(afc)} (AFC) x ${name(nfc)} (NFC)!`, 'good');
    return;
  }
  if (ph.kind === 'SUPER_BOWL') {
    const sb = ph.fixtures[0];
    const championId = fixtureWinner(sb), runnerUpId = fixtureLoser(sb);
    s.teams[championId].cash = round1(s.teams[championId].cash + 10);
    s.history.unshift({ year: s.seasonYear, championId, runnerUpId, userRecord: { ...s.teams[user].record } });
    s.phase = { kind: 'SEASON_RECAP', championId, runnerUpId };
    if (championId === user) s.boardMorale = clamp(s.boardMorale + 20, 0, 100);
    pushNews(s, `🏆 ${name(championId)} é CAMPEÃO do Super Bowl ${s.seasonYear}!`, championId === user ? 'good' : 'info');
  }
}

/** Consolida a rodada: placares, classificação, energia, lesões, finanças, moral. */
function finishWeek(state, rng) {
  const s = structuredClone(state);
  const ph = s.phase;
  const user = s.userTeamId;
  const playoff = ph.kind !== 'REGULAR_SEASON';
  const label = ph.kind === 'REGULAR_SEASON' ? `Semana ${ph.week}` : PHASE_LABELS[ph.kind];
  for (const p of Object.values(s.players)) if (p.injuryWeeks > 0) p.injuryWeeks -= 1;

  for (const m of s.liveRound.matches) {
    const fixture = findFixture(s, m.fixtureId);
    fixture.result = { home: m.score.home, away: m.score.away };
    if (playoff) s.playoffResults.push({ ...fixture, round: ph.kind });
    for (const [id, e] of Object.entries(m.energy)) if (s.players[id]) s.players[id].energy = Math.round(e);
    for (const [id, st] of Object.entries(m.stats)) {
      const p = s.players[id];
      if (p) for (const k of Object.keys(st)) p.stats[k] += st[k];
    }
    for (const inj of m.injuries) if (s.players[inj.playerId]) s.players[inj.playerId].injuryWeeks = Math.max(s.players[inj.playerId].injuryWeeks, inj.weeks);

    for (const side of /** @type {Side[]} */ (['home', 'away'])) {
      const teamId = side === 'home' ? m.homeId : m.awayId;
      const team = s.teams[teamId];
      const pf = m.score[side], pa = m.score[otherSide(side)];
      const outcome = pf > pa ? 'W' : pf < pa ? 'L' : 'T';
      if (!playoff) {
        team.record.pf += pf; team.record.pa += pa;
        if (outcome === 'W') team.record.w += 1; else if (outcome === 'L') team.record.l += 1; else team.record.t += 1;
      }
      for (const p of rosterOf(s, teamId)) {
        const delta = outcome === 'W' ? (p.starter ? 4 : 1) : outcome === 'L' ? (p.starter ? -3 : -2) : 0;
        p.morale = clamp(p.morale + delta - (p.starter ? 0 : 1), 0, 100);
      }
      const payroll = processSalaryCap(team, rosterOf(s, teamId)).payroll;
      const gate = side === 'home' && !m.neutral ? 3 + 3 * team.fanBase * (0.5 + winPct(team.record)) : 0;
      const income = LEAGUE_RULES.TV_REVENUE + gate + (playoff ? 4 : 0);
      const expense = payroll / LEAGUE_RULES.SALARY_WEEKS;
      team.cash = round1(team.cash + income - expense);
      if (teamId === user) {
        const opp = s.teams[side === 'home' ? m.awayId : m.homeId];
        pushLedger(s, `${label} ${side === 'home' && !m.neutral ? 'vs' : '@'} ${opp.abbr}`, income, expense);
        const boardDelta = playoff ? (outcome === 'W' ? 6 : -2) : outcome === 'W' ? 4 : outcome === 'L' ? -5 : -1;
        s.boardMorale = clamp(s.boardMorale + boardDelta, 0, 100);
        const txt = `${label}: ${s.teams[m.homeId].abbr} ${m.score.home} x ${m.score.away} ${s.teams[m.awayId].abbr}`;
        pushNews(s, `${outcome === 'W' ? '✅ Vitória' : outcome === 'L' ? '❌ Derrota' : '➖ Empate'} — ${txt}`, outcome === 'W' ? 'good' : outcome === 'L' ? 'bad' : 'info');
        m.injuries.filter((i) => s.players[i.playerId]?.teamId === user)
          .forEach((i) => pushNews(s, `🚑 ${s.players[i.playerId].name} (${s.players[i.playerId].position}) desfalca o time por ${i.weeks} semana(s).`, 'bad'));
      }
    }
  }
  for (const p of Object.values(s.players)) p.energy = Math.min(100, p.energy + LEAGUE_RULES.ENERGY_RECOVERY);
  if (s.teams[user].cash < 0) {
    s.boardMorale = clamp(s.boardMorale - 3, 0, 100);
    pushNews(s, '💸 Caixa negativo! A diretoria exige ajuste financeiro.', 'bad');
  }
  s.liveRound = null;
  advancePhase(s);
  aiWeeklyMaintenance(s);
  prepareAiTeams(s);
  if (s.boardMorale <= 0) {
    s.phase = { kind: 'GAME_OVER', reason: `A diretoria do ${s.teams[user].city} ${s.teams[user].name} perdeu a confiança e demitiu você.` };
  }
  return s;
}

// --- 3a.5 Offseason & Draft ---------------------------------------------------------
function startOffseason(state, rng) {
  const ph = state.phase;
  if (ph.kind !== 'SEASON_RECAP') return state;
  const s = structuredClone(state);
  const order = computeDraftOrder(s.teams, s.teamOrder, ph.championId, ph.runnerUpId);
  const userBefore = rosterOf(s, s.userTeamId).map((p) => p.id);
  const aged = processOffseasonAging(s.players, rng);
  s.players = aged.players;
  aged.retired.filter((p) => userBefore.includes(p.id)).forEach((p) => pushNews(s, `👴 ${p.name} (${p.position}, ${p.age} anos) anunciou a aposentadoria.`));
  pushNews(s, `${aged.retired.length} jogadores se aposentaram na liga.`);
  for (const id of s.teamOrder) s.teams[id].record = emptyRecord();
  const prospects = generateDraftClass(s.seasonYear + 1, rng, makeIdGen(s));
  prospects.forEach((p) => { s.players[p.id] = p; });
  s.phase = { kind: 'OFFSEASON_DRAFT', order, pickIndex: 0, rounds: LEAGUE_RULES.DRAFT_ROUNDS, prospectIds: prospects.map((p) => p.id), picks: [] };
  pushNews(s, `📋 NFL Draft aberto: ${prospects.length} prospectos universitários. Você escolhe na posição ${order.indexOf(s.userTeamId) + 1}.`, 'good');
  return s;
}

/** Executa a escolha atual num rascunho. */
function makeDraftPick(s, playerId) {
  const ph = /** @type {Extract<SeasonPhase, {kind:'OFFSEASON_DRAFT'}>} */ (s.phase);
  const teamId = draftCurrentTeam(ph);
  const round = Math.floor(ph.pickIndex / ph.order.length) + 1;
  const p = s.players[playerId];
  p.teamId = teamId; p.starter = false; p.salary = rookieSalary(round, p.ovr); p.morale = 75;
  ph.picks.push({ pick: ph.pickIndex + 1, round, teamId, playerId });
  ph.pickIndex += 1;
  if (teamId === s.userTeamId) pushNews(s, `🎓 Draft R${round}: você selecionou ${p.name} (${p.position}, OVR ${p.ovr}).`, 'good');
}

function draftSimToUser(state) {
  const s = structuredClone(state);
  const ph = /** @type {any} */ (s.phase);
  while (!draftComplete(ph) && draftCurrentTeam(ph) !== s.userTeamId) {
    const choice = aiDraftChoice(availableProspects(s), rosterOf(s, draftCurrentTeam(ph)));
    if (!choice) { ph.pickIndex = ph.order.length * ph.rounds; break; }
    makeDraftPick(s, choice.id);
  }
  return s;
}

function startNewSeason(state, rng) {
  const s = structuredClone(state);
  const user = s.userTeamId;
  s.seasonYear += 1;
  s.playoffResults = [];
  for (const id of s.teamOrder) if (id !== user) aiOffseasonRoster(s, id);
  // Usuário acima do limite: dispensa automática dos menos valiosos.
  let guard = 20;
  while (guard-- > 0 && rosterOf(s, user).length > LEAGUE_RULES.MAX_ROSTER) {
    const roster = rosterOf(s, user);
    const cut = roster.filter((p) => roster.filter((x) => x.position === p.position).length > STARTER_SLOTS[p.position])
      .sort((a, b) => a.ovr - b.ovr)[0];
    if (!cut) break;
    releaseToMarket(s, cut);
    pushNews(s, `✂️ Corte de elenco: ${cut.name} (${cut.position}, OVR ${cut.ovr}) dispensado para cumprir o limite de ${LEAGUE_RULES.MAX_ROSTER}.`, 'bad');
  }
  // Renovação do mercado: veteranos sem clube se aposentam, novos free agents surgem.
  for (const p of Object.values(s.players)) if (p.teamId === null && (p.age >= 34 || rng() < 0.3)) delete s.players[p.id];
  generateFreeAgents(rng, makeIdGen(s), 24).forEach((p) => { s.players[p.id] = p; });
  for (const p of Object.values(s.players)) { p.energy = 100; p.injuryWeeks = 0; }
  fillLineupGaps(s, user);
  s.schedule = generateSchedule(s.teamOrder, LEAGUE_RULES.REGULAR_SEASON_WEEKS, rng);
  s.phase = { kind: 'REGULAR_SEASON', week: 1 };
  prepareAiTeams(s);
  const cap = processSalaryCap(s.teams[user], rosterOf(s, user));
  pushNews(s, `🏈 Começa a temporada ${s.seasonYear}!${cap.overCap ? ' ⚠️ Seu time está ACIMA do Salary Cap — dispense jogadores.' : ''}`, cap.overCap ? 'bad' : 'good');
  return s;
}

// --- 3a.6 Reducer -------------------------------------------------------------------
/**
 * @param {GameState|null} state @param {GameAction} action @param {{rng: () => number}} env
 * @returns {GameState|null}
 */
function gameReducer(state, action, env) {
  if (validateAction(state, action)) return state;
  const { rng } = env;
  switch (action.type) {
    case 'NEW_GAME': return createNewGame(action.userTeamId, rng);
    case 'TOGGLE_STARTER': {
      const s = structuredClone(state);
      const p = s.players[action.playerId];
      if (p.starter) { p.starter = false; return s; }
      const energy = s.liveRound ? Object.assign({}, ...s.liveRound.matches.map((m) => m.energy)) : {};
      const same = rosterOf(s, s.userTeamId).filter((x) => x.position === p.position && x.starter);
      if (same.length >= STARTER_SLOTS[p.position]) {
        same.sort((a, b) => a.ovr * energyFactor(energyOf(a, energy)) - b.ovr * energyFactor(energyOf(b, energy)))[0].starter = false;
      }
      p.starter = true;
      return s;
    }
    case 'SWAP_STARTER': {
      const s = structuredClone(state);
      s.players[action.outId].starter = false;
      s.players[action.inId].starter = true;
      return s;
    }
    case 'AUTO_LINEUP': {
      const s = structuredClone(state);
      const energy = s.liveRound ? Object.assign({}, ...s.liveRound.matches.map((m) => m.energy)) : null;
      const injured = new Set(s.liveRound ? s.liveRound.matches.flatMap((m) => m.injuries.map((i) => i.playerId)) : []);
      const roster = rosterOf(s, s.userTeamId).map((p) => ({ ...p, energy: energy ? energyOf(p, energy) : p.energy, injuryWeeks: injured.has(p.id) ? 1 : p.injuryWeeks }));
      const ids = autoLineupIds(roster);
      rosterOf(s, s.userTeamId).forEach((p) => { p.starter = ids.has(p.id); });
      return s;
    }
    case 'SET_TACTIC': {
      const s = structuredClone(state);
      s.teams[s.userTeamId].tactic[action.field] = /** @type {any} */ (action.value);
      return s;
    }
    case 'SIGN_FREE_AGENT': {
      const s = structuredClone(state);
      const p = s.players[action.playerId];
      const bonus = signingBonus(p);
      s.teams[s.userTeamId].cash = round1(s.teams[s.userTeamId].cash - bonus);
      p.teamId = s.userTeamId; p.starter = false; p.morale = 70;
      pushLedger(s, `Luvas: ${p.name}`, 0, bonus);
      pushNews(s, `✍️ Contratado o free agent ${p.name} (${p.position}, OVR ${p.ovr}) por $${p.salary.toFixed(1)}M/ano.`, 'good');
      return s;
    }
    case 'BUY_PLAYER': {
      const s = structuredClone(state);
      const p = s.players[action.playerId];
      const price = marketValue(p);
      const seller = s.teams[p.teamId];
      s.teams[s.userTeamId].cash = round1(s.teams[s.userTeamId].cash - price);
      seller.cash = round1(seller.cash + price);
      pushLedger(s, `Compra: ${p.name} (${seller.abbr})`, 0, price);
      pushNews(s, `💰 ${p.name} (${p.position}, OVR ${p.ovr}) comprado do ${seller.city} ${seller.name} por $${price.toFixed(1)}M.`, 'good');
      p.teamId = s.userTeamId; p.starter = false; p.morale = 72;
      applyAutoLineup(s, seller.id);
      return s;
    }
    case 'RELEASE_PLAYER': {
      const s = structuredClone(state);
      const p = s.players[action.playerId];
      const cost = releaseCost(p);
      s.teams[s.userTeamId].cash = round1(s.teams[s.userTeamId].cash - cost);
      pushLedger(s, `Rescisão: ${p.name}`, 0, cost);
      pushNews(s, `👋 ${p.name} (${p.position}) foi dispensado. Multa: $${cost.toFixed(1)}M.`);
      releaseToMarket(s, p);
      return s;
    }
    case 'START_WEEK': return startWeek(state, rng);
    case 'SIM_TICK': return simRoundTick(state, rng);
    case 'SIM_TO_END': {
      let s = state, guard = 2000;
      while (guard-- > 0 && s.liveRound.matches.some((m) => m.status.kind !== 'FINAL')) s = simRoundTick(s, rng);
      return s;
    }
    case 'FINISH_WEEK': return finishWeek(state, rng);
    case 'START_OFFSEASON': return startOffseason(state, rng);
    case 'DRAFT_PICK': { const s = structuredClone(state); makeDraftPick(s, action.playerId); return s; }
    case 'DRAFT_SIM_TO_USER': return draftSimToUser(state);
    case 'START_NEW_SEASON': return startNewSeason(state, rng);
    default: return state;
  }
}

/** Validação estrutural de um save carregado. @returns {GameSaveState|null} */
function parseSave(raw) {
  try {
    const save = JSON.parse(raw);
    if (!save || save.version !== LEAGUE_RULES.SAVE_VERSION) return null;
    const st = save.state;
    const ok = st && typeof st.seasonYear === 'number' && st.teams && st.players && Array.isArray(st.schedule)
      && st.phase && typeof st.phase.kind === 'string' && st.teams[st.userTeamId];
    return ok ? save : null;
  } catch { return null; }
}

// --- 3b. STORE RUNTIME (efeitos colaterais) -----------------------------------------
function createStore(reducer, initial, env) {
  let state = initial;
  const subs = new Set();
  return {
    getState: () => state,
    dispatch(action) { const prev = state; state = reducer(state, action, env); if (state !== prev) subs.forEach((f) => f(state, action)); },
    replace(next) { state = next; subs.forEach((f) => f(state, { type: '@@REPLACE' })); },
    subscribe(f) { subs.add(f); return () => subs.delete(f); },
  };
}

function loadGame() {
  try { const raw = localStorage.getItem(LEAGUE_RULES.SAVE_KEY); return raw ? parseSave(raw)?.state ?? null : null; } catch { return null; }
}
let saveTimer = null;
let pendingSave = false;
function persist(state) {
  pendingSave = false;
  try {
    if (!state) { localStorage.removeItem(LEAGUE_RULES.SAVE_KEY); return; }
    /** @type {GameSaveState} */
    const save = { version: LEAGUE_RULES.SAVE_VERSION, savedAt: new Date().toISOString(), state };
    localStorage.setItem(LEAGUE_RULES.SAVE_KEY, JSON.stringify(save));
  } catch { /* armazenamento indisponível: o jogo segue apenas em memória */ }
}
/** Debounce: durante a partida ao vivo há ~20 dispatches/s; grava no máximo a cada 400ms. */
function scheduleSave(state) {
  clearTimeout(saveTimer);
  pendingSave = true;
  saveTimer = setTimeout(() => persist(state), 400);
}

const store = createStore(gameReducer, loadGame(), { rng: makeRng(Date.now() ^ 0x9e3779b9) });
store.subscribe(scheduleSave);
window.addEventListener('pagehide', () => { if (pendingSave) { clearTimeout(saveTimer); persist(store.getState()); } });

function primaryAction(s) {
  const ph = s.phase;
  if (s.liveRound) return null;
  if (isPlayablePhase(ph)) {
    const plays = currentFixtures(s).some((f) => f.homeId === s.userTeamId || f.awayId === s.userTeamId);
    return { label: plays ? (ph.kind === 'REGULAR_SEASON' ? '▶ Jogar Semana' : '▶ Jogar Playoff') : '▶ Simular Rodada', action: { type: 'PLAY_WEEK' } };
  }
  if (ph.kind === 'SEASON_RECAP') return { label: '🎓 Iniciar Offseason', action: { type: 'GAME', game: { type: 'START_OFFSEASON' }, view: 'draft' } };
  if (ph.kind === 'OFFSEASON_DRAFT') {
    if (draftComplete(ph)) return { label: `🏈 Iniciar Temporada ${s.seasonYear + 1}`, action: { type: 'GAME', game: { type: 'START_NEW_SEASON' }, view: 'roster' } };
    if (draftCurrentTeam(ph) !== s.userTeamId) return { label: '⏩ Simular até minha vez', action: { type: 'GAME', game: { type: 'DRAFT_SIM_TO_USER' } } };
  }
  return null;
}

function sortRoster(roster, { key, dir }) {
  const posIdx = (p) => POSITIONS.indexOf(p.position);
  const cmp = {
    pos: (a, b) => posIdx(a) - posIdx(b) || Number(b.starter) - Number(a.starter) || b.ovr - a.ovr,
    name: (a, b) => a.name.localeCompare(b.name), age: (a, b) => a.age - b.age, ovr: (a, b) => a.ovr - b.ovr,
    energy: (a, b) => a.energy - b.energy, morale: (a, b) => a.morale - b.morale, salary: (a, b) => a.salary - b.salary,
  }[key];
  return [...roster].sort((a, b) => cmp(a, b) * dir);
}

  const rows = [['Passe', r.passing], ['Corrida', r.rushing], ['Proteção', r.passBlock], ['Pass Rush', r.passRush], ['Contra Corrida', r.runDef], ['Cobertura', r.coverage], ['Chute', r.kicking]];

function renderTactics(s) {
