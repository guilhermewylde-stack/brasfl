  const r = calculateUnitStrength(selectLineup(rosterOf(s, me.id), {}, [], false), me.tactic);
  const next = currentFixtures(s).find((f) => f.homeId === me.id || f.awayId === me.id);
  const opp = next ? s.teams[next.homeId === me.id ? next.awayId : next.homeId] : null;
  const matrix = `<table class="dense text-xs w-full"><thead><tr class="text-slate-400"><th class="text-left">Ataque \\ Defesa</th>${Object.values(DEFENSIVE_SCHEMES).map((d) => `<th>${d.icon}</th>`).join('')}</tr></thead><tbody>
    ${Object.entries(TACTICAL_SYNERGY).map(([o, row]) => `<tr class="${o === me.tactic.offense ? 'bg-slate-700/50' : ''}"><td class="text-left">${OFFENSIVE_SCHEMES[o].icon} ${OFFENSIVE_SCHEMES[o].label}</td>${Object.values(row).map((v) => `<td class="text-center">${synergyTxt(v)}</td>`).join('')}</tr>`).join('')}
  </tbody></table><div class="text-[11px] text-slate-500 mt-1">Colunas: ${Object.values(DEFENSIVE_SCHEMES).map((d) => `${d.icon} ${d.label}`).join(' · ')}</div>`;
  const scout = opp ? `<div class="flex items-center gap-2 mb-2">${teamChip(opp)} <b>${esc(teamName(opp))}</b></div>
    <div class="text-xs space-y-1 text-slate-300">
      <div>Ataque deles: <b>${OFFENSIVE_SCHEMES[opp.tactic.offense].icon} ${OFFENSIVE_SCHEMES[opp.tactic.offense].label}</b></div>
      <div>Defesa deles: <b>${DEFENSIVE_SCHEMES[opp.tactic.defense].icon} ${DEFENSIVE_SCHEMES[opp.tactic.defense].label}</b></div>
      <div class="pt-1">Seu ataque vs defesa deles: ${synergyTxt(tacticalSynergy(me.tactic.offense, opp.tactic.defense))}</div>
      <div>Ataque deles vs sua defesa: ${synergyTxt(-tacticalSynergy(opp.tactic.offense, me.tactic.defense))}</div>
      <div class="text-[11px] text-slate-500 pt-1">A IA pode reajustar sua tática no início da rodada.</div></div>` : '<div class="text-sm text-slate-400">Sem adversário nesta rodada.</div>';
  return `<div class="grid lg:grid-cols-3 gap-4">
    <div class="lg:col-span-2 space-y-4">
      ${card('🏈 Esquema Ofensivo', tacticButtons(s, 'offense', OFFENSIVE_SCHEMES))}
      ${card('🛡️ Esquema Defensivo', tacticButtons(s, 'defense', DEFENSIVE_SCHEMES))}
      ${card('4️⃣ Postura na 4ª Descida', tacticButtons(s, 'fourthDown', FOURTH_DOWN_POSTURES))}
    </div>
    <div class="space-y-4">
      ${card('📊 Força das Unidades', strengthBars(r) + `<div class="mt-3 grid grid-cols-2 gap-2 text-center"><div class="rounded bg-slate-800 p-2"><div class="text-[10px] text-slate-400">ATAQUE</div><div class="text-2xl font-black">${r.offense.toFixed(0)}</div></div><div class="rounded bg-slate-800 p-2"><div class="text-[10px] text-slate-400">DEFESA</div><div class="text-2xl font-black">${r.defense.toFixed(0)}</div></div></div>`)}
      ${card('🔎 Scout do Próximo Adversário', scout)}
      ${card('⚔️ Sinergia Tática', matrix)}
    </div></div>`;
}

// --- 4.6 Classificação --------------------------------------------------------------
function standingsTable(s, conf) {
  const rows = computeStandings(s.teams, s.teamOrder.filter((id) => s.teams[id].conference === conf));
  return `<table class="dense w-full text-sm"><thead class="text-xs uppercase text-slate-400 bg-slate-800/80"><tr>
    <th class="text-left">#</th><th class="text-left">Time</th><th>V</th><th>D</th><th>E</th><th>PF</th><th>PS</th><th>Saldo</th><th>%</th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr class="${r.team.id === s.userTeamId ? 'font-black text-amber-200' : ''} ${i === LEAGUE_RULES.PLAYOFF_SEEDS - 1 ? 'border-b-2 border-emerald-600' : ''}">
      <td class="${i < LEAGUE_RULES.PLAYOFF_SEEDS ? 'text-emerald-400 font-bold' : 'text-slate-500'}">${i + 1}</td>
      <td class="text-left"><div class="flex items-center gap-2">${teamChip(r.team)} <span class="hidden sm:inline">${esc(teamName(r.team))}</span></div></td>
      <td class="text-center">${r.w}</td><td class="text-center">${r.l}</td><td class="text-center">${r.t}</td><td class="text-center">${r.pf}</td><td class="text-center">${r.pa}</td>
      <td class="text-center ${r.diff > 0 ? 'text-emerald-400' : r.diff < 0 ? 'text-red-400' : ''}">${r.diff > 0 ? '+' : ''}${r.diff}</td><td class="text-center">${r.pct.toFixed(3).replace(/^0/, '')}</td></tr>`).join('')}
  </tbody></table>`;
}
function renderLeaders(s) {
  const all = Object.values(s.players).filter((p) => p.teamId);
  const list = (key, label, unit) => {
    const top = [...all].sort((a, b) => b.stats[key] - a.stats[key]).slice(0, 5).filter((p) => p.stats[key] > 0);
    return `<div><div class="text-xs font-bold text-slate-400 mb-1">${label}</div>${top.length ? top.map((p) => `<div class="flex justify-between text-xs py-0.5 ${p.teamId === s.userTeamId ? 'text-amber-200 font-bold' : ''}"><span>${esc(p.name)} <span class="text-slate-500">${p.position} · ${p.teamId}</span></span><b>${p.stats[key]} ${unit}</b></div>`).join('') : '<div class="text-xs text-slate-600">—</div>'}</div>`;
  };
  return `<div class="grid sm:grid-cols-2 lg:grid-cols-5 gap-4">${list('td', 'Touchdowns', 'TD')}${list('yds', 'Jardas', 'jd')}${list('sacks', 'Sacks', 'SK')}${list('ints', 'Interceptações', 'INT')}${list('fg', 'Field Goals', 'FG')}</div>`;
}
function renderStandings(s) {
  return `<div class="grid lg:grid-cols-2 gap-4 mb-4">
      ${card('<span class="text-red-400">AFC</span> — Classificação', `<div class="overflow-x-auto scroll-thin">${standingsTable(s, 'AFC')}</div>`)}
      ${card('<span class="text-sky-400">NFC</span> — Classificação', `<div class="overflow-x-auto scroll-thin">${standingsTable(s, 'NFC')}</div>`)}
    </div>
    <p class="text-xs text-slate-500 mb-4">Os ${LEAGUE_RULES.PLAYOFF_SEEDS} primeiros de cada conferência avançam aos playoffs (1º x 4º, 2º x 3º). Desempate: % de vitórias, saldo, pontos feitos.</p>
    ${card('⭐ Líderes da Temporada', renderLeaders(s))}
    ${s.history.length ? card('📜 Galeria de Campeões', s.history.map((h) => `<div class="flex items-center gap-2 text-sm py-1"><b class="w-12">${h.year}</b>🏆 ${teamChip(s.teams[h.championId])} ${esc(teamName(s.teams[h.championId]))} <span class="text-slate-500 text-xs">vice: ${h.runnerUpId} · seu time: ${h.userRecord.w}-${h.userRecord.l}-${h.userRecord.t}</span></div>`).join(''), 'mt-4') : ''}`;
}

// --- 4.7 Calendário & playoffs ------------------------------------------------------
function fixtureRow(s, f) {
  const h = s.teams[f.homeId], a = s.teams[f.awayId];
  const res = f.result;
  const mine = f.homeId === s.userTeamId || f.awayId === s.userTeamId;
  return `<div class="flex items-center gap-2 py-1 px-2 rounded text-sm ${mine ? 'bg-slate-700/50 font-bold' : ''}">
    ${teamChip(a)}<span class="w-7 text-right font-black ${res && res.away > res.home ? 'text-white' : 'text-slate-400'}">${res ? res.away : ''}</span>
    <span class="text-slate-500 text-xs">${f.neutral ? 'vs' : '@'}</span>
    <span class="w-7 font-black ${res && res.home > res.away ? 'text-white' : 'text-slate-400'}">${res ? res.home : ''}</span>${teamChip(h)}
    ${res ? '' : '<span class="text-xs text-slate-500 ml-1">a jogar</span>'}</div>`;
}
function renderBracket(s) {
  const ph = s.phase;
  const rounds = [['PLAYOFFS_DIVISIONAL', 'Semifinais de Conferência'], ['PLAYOFFS_CONFERENCE', 'Finais de Conferência'], ['SUPER_BOWL', 'Super Bowl']];
  const cols = rounds.map(([kind, label]) => {
    const done = s.playoffResults.filter((f) => f.round === kind);
    const pending = 'fixtures' in ph && ph.kind === kind ? ph.fixtures.filter((f) => !f.result) : [];
    const list = [...done, ...pending];
    return `<div><div class="text-xs font-bold uppercase text-slate-400 mb-2">${label}</div>${list.length ? list.map((f) => fixtureRow(s, f)).join('') : '<div class="text-xs text-slate-600">A definir</div>'}</div>`;
  }).join('');
  const seeds = 'seeds' in ph ? ph.seeds : null;
  return `<div class="grid md:grid-cols-3 gap-4">${cols}</div>${seeds ? `<div class="text-xs text-slate-400 mt-3">Seeds — AFC: ${seeds.AFC.map((id, i) => `${i + 1}. ${id}`).join(' · ')} | NFC: ${seeds.NFC.map((id, i) => `${i + 1}. ${id}`).join(' · ')}</div>` : ''}`;
}
function renderSchedule(s) {
  const user = s.userTeamId;
  const mine = s.schedule.filter((f) => f.homeId === user || f.awayId === user);
  const currentWeek = s.phase.kind === 'REGULAR_SEASON' ? s.phase.week : LEAGUE_RULES.REGULAR_SEASON_WEEKS;
  const week = ui.scheduleWeek ?? currentWeek;
  const list = mine.map((f) => {
    const home = f.homeId === user;
    const opp = s.teams[home ? f.awayId : f.homeId];
    const res = f.result;
    const my = res ? (home ? res.home : res.away) : null, their = res ? (home ? res.away : res.home) : null;
    const tag = res ? (my > their ? '<span class="text-emerald-400 font-black">V</span>' : my < their ? '<span class="text-red-400 font-black">D</span>' : '<span class="text-slate-300 font-black">E</span>') : '';
    return `<button ${uiAttr({ type: 'SCHEDULE_WEEK', week: f.week })} class="w-full flex items-center gap-2 text-sm py-1 px-2 rounded hover:bg-slate-800 ${f.week === week ? 'bg-slate-800 ring-1 ring-slate-600' : ''} ${f.week === currentWeek && s.phase.kind === 'REGULAR_SEASON' ? 'font-bold' : ''}">
      <span class="w-14 text-left text-slate-400 text-xs">Sem. ${f.week}</span><span class="w-6 text-xs text-slate-500">${home ? 'vs' : '@'}</span>${teamChip(opp)}<span class="flex-1 text-left truncate">${esc(opp.name)}</span>
      <span class="w-14 text-right">${res ? `${my}-${their}` : ''}</span><span class="w-4">${tag}</span></button>`;
  }).join('');
  const weekFixtures = s.schedule.filter((f) => f.week === week);
  const inPlayoffs = s.playoffResults.length > 0 || ['PLAYOFFS_DIVISIONAL', 'PLAYOFFS_CONFERENCE', 'SUPER_BOWL'].includes(s.phase.kind);
  return `${inPlayoffs ? card('🏆 Chave dos Playoffs', renderBracket(s), 'mb-4') : ''}
    <div class="grid lg:grid-cols-2 gap-4">
      ${card(`📅 Seu Calendário ${s.seasonYear}`, list || '<div class="text-sm text-slate-500">Calendário será gerado na nova temporada.</div>')}
      ${card(`🗓️ Rodada — Semana ${week}`, weekFixtures.map((f) => fixtureRow(s, f)).join('') || '<div class="text-sm text-slate-500">—</div>')}
    </div>`;
}

// --- 4.8 Mercado --------------------------------------------------------------------
function posFilter(current, type) {
  return `<div class="flex flex-wrap gap-1">${['ALL', ...POSITIONS].map((p) => `<button ${uiAttr({ type, pos: p })} class="px-2 py-1 text-xs font-bold rounded ${current === p ? 'tab-active' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">${p === 'ALL' ? 'Todas' : p}</button>`).join('')}</div>`;
}
function playerMarketTable(s, players, actionFor) {
  if (!players.length) return '<div class="text-sm text-slate-500 p-3">Nenhum jogador encontrado.</div>';
  return `<div class="overflow-x-auto scroll-thin"><table class="dense w-full text-sm"><thead class="text-left text-xs uppercase text-slate-400 bg-slate-800/80"><tr>
    <th>Pos</th><th>Nome</th><th>Time</th><th>Idade</th><th>OVR</th><th>Salário</th><th>Característica</th><th>Ação</th></tr></thead><tbody>
    ${players.map((p) => { const a = actionFor(p); const err = validateAction(s, a.game); return `<tr>
      <td class="font-bold text-slate-300">${p.position}</td><td class="font-semibold">${esc(p.name)}</td>
      <td>${p.teamId ? teamChip(s.teams[p.teamId]) : '<span class="text-xs text-slate-500">FA</span>'}</td>
      <td>${p.age}</td><td class="font-black ${ovrClass(p.ovr)}">${p.ovr}</td><td>${money(p.salary)}</td><td>${traitBadge(p.trait)}</td>
      <td><button ${gameAttr(a.game)} data-confirm="${esc(a.confirm)}" title="${esc(err || a.confirm)}" class="btn ${a.cls} text-xs ${err ? 'btn-dim' : ''}">${a.label}</button></td></tr>`; }).join('')}
  </tbody></table></div>`;
}
function renderMarket(s) {
  const user = s.userTeamId;
  const cap = processSalaryCap(s.teams[user], rosterOf(s, user));
  const posOk = (p) => ui.marketPos === 'ALL' || p.position === ui.marketPos;
  const tabs = [['fa', '🆓 Free Agents'], ['trade', '🔁 Outros Times'], ['release', '✂️ Dispensar']];
  let body;
  if (ui.marketTab === 'fa') {
    const list = Object.values(s.players).filter((p) => isFreeAgent(s, p) && posOk(p)).sort((a, b) => b.ovr - a.ovr);
    body = playerMarketTable(s, list, (p) => ({ game: { type: 'SIGN_FREE_AGENT', playerId: p.id }, label: `Contratar (${money(signingBonus(p))})`, cls: 'bg-emerald-700', confirm: `Contratar ${p.name} por ${money(p.salary)}/ano + luvas de ${money(signingBonus(p))}?` }));
  } else if (ui.marketTab === 'trade') {
    const list = Object.values(s.players).filter((p) => p.teamId && p.teamId !== user && posOk(p)).sort((a, b) => b.ovr - a.ovr).slice(0, 80);
    body = playerMarketTable(s, list, (p) => ({ game: { type: 'BUY_PLAYER', playerId: p.id }, label: `Comprar ${money(marketValue(p))}`, cls: 'bg-sky-700', confirm: `Pagar ${money(marketValue(p))} ao ${p.teamId} por ${p.name} (salário ${money(p.salary)}/ano)?` }));
  } else {
    const list = sortRoster(rosterOf(s, user), { key: 'pos', dir: 1 }).filter(posOk);
    body = playerMarketTable(s, list, (p) => ({ game: { type: 'RELEASE_PLAYER', playerId: p.id }, label: `Dispensar (${money(releaseCost(p))})`, cls: 'bg-red-800', confirm: `Dispensar ${p.name}? Multa rescisória de ${money(releaseCost(p))}.` }));
  }
  return `<div class="flex flex-wrap items-center gap-2 mb-3">
      ${tabs.map(([id, l]) => `<button ${uiAttr({ type: 'MARKET_TAB', tab: id })} class="btn ${ui.marketTab === id ? 'tab-active' : 'bg-slate-800 text-slate-300'}">${l}</button>`).join('')}
      <div class="ml-auto text-xs text-slate-300 flex gap-4"><span>Caixa: <b>${money(s.teams[user].cash)}</b></span><span>Espaço no Cap: <b class="${cap.capSpace < 0 ? 'text-red-400' : 'text-emerald-400'}">${money(cap.capSpace)}</b></span><span>Elenco: <b>${rosterOf(s, user).length}/${LEAGUE_RULES.MAX_ROSTER}</b></span></div>
    </div>
    <div class="mb-3">${posFilter(ui.marketPos, 'MARKET_POS')}</div>
    ${s.liveRound ? '<div class="text-amber-300 text-sm mb-2">Mercado fechado durante a rodada.</div>' : ''}
    <div class="rounded-lg border border-slate-700/80 bg-slate-900/70">${body}</div>
    <p class="text-xs text-slate-500 mt-2">Free agents cobram luvas de 20% do salário. Compras pagam o valor de mercado ao clube vendedor (que precisa manter reposição na posição). Dispensas custam 25% do salário anual.</p>`;
}

// --- 4.9 Finanças & notícias --------------------------------------------------------
function renderFinances(s) {
  const t = s.teams[s.userTeamId];
  const roster = rosterOf(s, t.id);
  const cap = processSalaryCap(t, roster);
  const box = (l, v, cls = '') => `<div class="rounded-lg bg-slate-800/80 p-3"><div class="text-[10px] uppercase text-slate-400">${l}</div><div class="text-xl font-black ${cls}">${v}</div></div>`;
  const ledger = s.ledger.length ? `<table class="dense w-full text-sm"><thead class="text-xs uppercase text-slate-400"><tr><th class="text-left">Lançamento</th><th class="text-right">Receita</th><th class="text-right">Despesa</th><th class="text-right">Saldo</th></tr></thead><tbody>
    ${s.ledger.map((e) => `<tr><td>${esc(e.label)}</td><td class="text-right text-emerald-400">${e.income ? money(e.income) : ''}</td><td class="text-right text-red-400">${e.expense ? money(e.expense) : ''}</td><td class="text-right font-bold">${money(e.income - e.expense)}</td></tr>`).join('')}</tbody></table>`
    : '<div class="text-sm text-slate-500">Sem lançamentos ainda.</div>';
  const top = [...roster].sort((a, b) => b.salary - a.salary).slice(0, 10).map((p) => `<div class="flex justify-between text-sm py-0.5"><span>${p.position} · ${esc(p.name)} <span class="text-xs text-slate-500">OVR ${p.ovr}</span></span><b>${money(p.salary)}</b></div>`).join('');
  return `<div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">
      ${box('Caixa', money(t.cash), t.cash < 0 ? 'text-red-400' : 'text-emerald-300')}${box('Folha Salarial', money(cap.payroll))}${box('Espaço no Cap', money(cap.capSpace), cap.overCap ? 'text-red-400' : '')}
      ${box('Custo semanal', money(cap.weeklyCost))}${box('Torcida', `${Math.round(t.fanBase * 100)}%`)}
    </div>
    <div class="grid lg:grid-cols-3 gap-4">
      ${card('📒 Livro-Caixa', `<div class="overflow-x-auto scroll-thin">${ledger}</div>`, 'lg:col-span-2')}
      <div class="space-y-4">
        ${card('💰 Maiores Salários', top)}
        ${card('🏛️ Diretoria', `<div class="text-sm text-slate-300 space-y-1"><div>Confiança atual: <b>${s.boardMorale}%</b></div>
          <div class="text-xs text-slate-400">Vitória +4 · Derrota −5 · Playoffs +10 · Fora dos playoffs −15 · Vitória em playoff +6 · Título +20 · Caixa negativo −3/semana. Em 0% você é demitido.</div>
          <div class="text-xs text-slate-400 pt-1">Receitas por jogo: TV ${money(LEAGUE_RULES.TV_REVENUE)} + bilheteria em casa (torcida × campanha) + bônus de playoff.</div></div>`)}
      </div>
    </div>`;
}
function renderNews(s) {
  const color = { good: 'border-emerald-600', bad: 'border-red-600', info: 'border-slate-600' };
  return card('📰 Últimas Notícias', s.news.length ? s.news.map((n) => `<div class="border-l-4 ${color[n.kind]} pl-3 py-1.5 mb-2 bg-slate-800/40 rounded-r"><div class="text-[11px] text-slate-500">${n.year} · ${esc(n.label)}</div><div class="text-sm">${esc(n.text)}</div></div>`).join('') : '<div class="text-sm text-slate-500">Sem notícias.</div>');
}

// --- 4.10 Draft, fim de temporada, demissão -----------------------------------------
function renderDraft(s) {
  const ph = /** @type {Extract<SeasonPhase, {kind:'OFFSEASON_DRAFT'}>} */ (s.phase);
  const complete = draftComplete(ph);
  const total = ph.order.length * ph.rounds;
  const current = complete ? null : draftCurrentTeam(ph);
  const round = Math.min(ph.rounds, Math.floor(ph.pickIndex / ph.order.length) + 1);
  const userTurn = current === s.userTeamId;
  const prospects = availableProspects(s).filter((p) => ui.draftPos === 'ALL' || p.position === ui.draftPos).sort((a, b) => b.ovr - a.ovr);
  const roster = rosterOf(s, s.userTeamId);
  const needs = POSITIONS.map((pos) => { const c = roster.filter((p) => p.position === pos).length; return `<span class="text-xs px-2 py-1 rounded ${c < ROSTER_TEMPLATE[pos] ? 'bg-amber-900/60 text-amber-300' : 'bg-slate-800 text-slate-400'}">${pos} ${c}/${ROSTER_TEMPLATE[pos]}</span>`; }).join(' ');
  const myPicks = ph.order.map((id, i) => (id === s.userTeamId ? i + 1 : null)).filter(Boolean);
  const table = `<div class="overflow-x-auto scroll-thin"><table class="dense w-full text-sm"><thead class="text-left text-xs uppercase text-slate-400 bg-slate-800/80"><tr><th>Pos</th><th>Nome</th><th>Idade</th><th>OVR</th><th>Característica</th><th>Salário rookie</th><th></th></tr></thead><tbody>
    ${prospects.map((p) => `<tr><td class="font-bold text-slate-300">${p.position}</td><td class="font-semibold">${esc(p.name)}</td><td>${p.age}</td><td class="font-black ${ovrClass(p.ovr)}">${p.ovr}</td><td>${traitBadge(p.trait)}</td><td>${money(rookieSalary(round, p.ovr))}</td>
      <td>${userTurn ? `<button ${gameAttr({ type: 'DRAFT_PICK', playerId: p.id })} class="btn team-accent-bg text-xs">Draftar</button>` : ''}</td></tr>`).join('')}
  </tbody></table></div>`;
  const board = [...ph.picks].reverse().slice(0, 24).map((pk) => { const p = s.players[pk.playerId]; return `<div class="flex items-center gap-2 text-xs py-1 ${pk.teamId === s.userTeamId ? 'text-amber-200 font-bold' : ''}"><span class="w-12 text-slate-500">R${pk.round} #${pk.pick}</span>${teamChip(s.teams[pk.teamId])}<span class="truncate">${p ? `${p.position} ${esc(p.name)} (${p.ovr})` : 'aposentado'}</span></div>`; }).join('');
  const status = complete ? `<div class="text-emerald-300 font-bold">✅ Draft concluído! Inicie a temporada ${s.seasonYear + 1} pelo botão no topo.</div>`
    : userTurn ? `<div class="text-amber-300 font-black text-lg animate-pulse">🎯 SUA VEZ! Rodada ${round}, escolha #${ph.pickIndex + 1}</div>`
    : `<div class="flex items-center gap-2">Na vez: ${teamChip(s.teams[current])} <b>${esc(teamName(s.teams[current]))}</b> · Rodada ${round} · Escolha #${ph.pickIndex + 1}/${total}</div>`;
  return `<div class="grid lg:grid-cols-3 gap-4">
    <div class="lg:col-span-2 space-y-3">
      ${card(`🎓 NFL Draft ${s.seasonYear + 1}`, `${status}<div class="text-xs text-slate-400 mt-1">Suas escolhas por rodada: posição ${myPicks.join(', ')} de ${ph.order.length}. Ordem inversa da classificação.</div><div class="mt-2 flex flex-wrap gap-1">${needs}</div>`)}
      <div>${posFilter(ui.draftPos, 'DRAFT_POS')}</div>
      <div class="rounded-lg border border-slate-700/80 bg-slate-900/70">${prospects.length ? table : '<div class="p-3 text-sm text-slate-500">Nenhum prospecto disponível.</div>'}</div>
    </div>
    <div>${card('📋 Últimas Escolhas', board || '<div class="text-xs text-slate-500">Nenhuma escolha ainda.</div>')}</div>
  </div>`;
}
function renderRecapBanner(s) {
  const ph = /** @type {Extract<SeasonPhase, {kind:'SEASON_RECAP'}>} */ (s.phase);
  const champ = s.teams[ph.championId];
  const sb = s.playoffResults.find((f) => f.round === 'SUPER_BOWL');
  const userWon = ph.championId === s.userTeamId;
  return `<div class="rounded-xl p-6 mb-4 text-center shadow-xl" style="background:${champ.colors.primary};color:${textOn(champ.colors.primary)};border:4px solid ${champ.colors.secondary}">
    <div class="text-5xl mb-1">🏆</div>
    <div class="text-sm uppercase tracking-widest opacity-80">Campeão do Super Bowl ${s.seasonYear}</div>
    <div class="text-4xl font-black">${esc(teamName(champ))}</div>
    ${sb ? `<div class="mt-1 font-bold">${s.teams[sb.homeId].abbr} ${sb.result.home} x ${sb.result.away} ${s.teams[sb.awayId].abbr}</div>` : ''}
    <div class="mt-3 text-sm">${userWon ? '🎉 VOCÊ É CAMPEÃO! A diretoria está em êxtase.' : 'Próxima parada: envelhecimento do elenco, aposentadorias e o NFL Draft.'}</div>
  </div>`;
}
function renderGameOver(s) {
  const ph = /** @type {Extract<SeasonPhase, {kind:'GAME_OVER'}>} */ (s.phase);
  return `<div class="max-w-xl mx-auto mt-10 text-center rounded-xl border-2 border-red-700 bg-slate-900 p-8">
    <div class="text-6xl">📉</div><h2 class="text-3xl font-black text-red-400 mt-2">DEMITIDO!</h2>
    <p class="mt-3 text-slate-300">${esc(ph.reason)}</p>
    <p class="mt-1 text-sm text-slate-500">Temporadas no comando: ${s.history.length + 1} · Títulos: ${s.history.filter((h) => h.championId === s.userTeamId).length}</p>
    <button ${uiAttr({ type: 'NEW_GAME' })} class="btn bg-amber-500 text-black mt-6 px-6 py-3">Procurar novo emprego</button></div>`;
}

// --- 4.11 Rodada ao vivo ------------------------------------------------------------
/** Campo alinhado ao placar: visitante defende a end zone esquerda, mandante a direita. */
function renderField(m, home, away) {
  const awayAttacking = m.possession === 'away';
  const ballX = awayAttacking ? m.ballOn : 100 - m.ballOn;
  const lineToGain = Math.min(100, m.ballOn + m.toGo);
  const fdX = awayAttacking ? lineToGain : 100 - lineToGain;
  const pos = (x) => `calc(8% + ${(x * 0.84).toFixed(2)}%)`;
  const live = m.status.kind === 'LIVE';
  return `<div class="relative h-12 rounded-md overflow-hidden field border border-green-950">
    <div class="absolute inset-y-0 left-0 w-[8%] flex items-center justify-center text-[10px] font-black" style="background:${away.colors.primary};color:${textOn(away.colors.primary)}">${away.abbr}</div>
    <div class="absolute inset-y-0 right-0 w-[8%] flex items-center justify-center text-[10px] font-black" style="background:${home.colors.primary};color:${textOn(home.colors.primary)}">${home.abbr}</div>
    <div class="absolute inset-y-0 left-1/2 w-px bg-white/50"></div>
    ${live ? `<div class="absolute inset-y-0 w-0.5 bg-yellow-300" style="left:${pos(fdX)}"></div>
    <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 text-xl transition-all duration-300" style="left:${pos(ballX)}">🏈</div>` : ''}
  </div>`;
}
function eventStyle(e) {
  switch (e.type) {
    case 'TOUCHDOWN': return 'bg-emerald-900/50 text-emerald-200 font-bold';
    case 'FIELD_GOAL': return e.good ? 'bg-sky-900/40 text-sky-200 font-semibold' : 'text-slate-300';
    case 'SAFETY': return 'bg-emerald-900/40 text-emerald-200 font-semibold';
    case 'INTERCEPTION': case 'FUMBLE': case 'TURNOVER_ON_DOWNS': return 'bg-orange-900/40 text-orange-200 font-semibold';
    case 'SACK': return 'text-rose-300';
    case 'INJURY': return 'bg-red-900/40 text-red-200';
    case 'BIG_PLAY': return 'text-yellow-200';
    case 'PERIOD': return 'text-slate-400 italic';
    default: return 'text-slate-300';
  }
}
function liveStrength(s, m) {
  const byTeam = (id) => rosterOf(s, id);
  const calc = (id) => calculateUnitStrength(selectLineup(byTeam(id), m.energy, m.injuries, id !== s.userTeamId), s.teams[id].tactic, m.energy, m.quarter >= 4);
  return { home: calc(m.homeId), away: calc(m.awayId) };
}
function duel(labelA, a, labelB, b, colorA, colorB) {
  const pct = (a / (a + b)) * 100;
  return `<div class="text-xs mb-2"><div class="flex justify-between mb-0.5"><span>${labelA} <b>${a.toFixed(0)}</b></span><span><b>${b.toFixed(0)}</b> ${labelB}</span></div>
    <div class="h-2.5 rounded overflow-hidden flex"><div style="width:${pct}%;background:${colorA}"></div><div style="width:${100 - pct}%;background:${colorB}"></div></div></div>`;
}
function renderLivePanel(s, m) {
  const user = s.userTeamId;
  const roster = rosterOf(s, user);
  const injured = new Set(m.injuries.map((i) => i.playerId));
  const e = (p) => Math.round(energyOf(p, m.energy));
  const groups = POSITIONS.map((pos) => {
    const atPos = roster.filter((p) => p.position === pos);
    const starters = atPos.filter((p) => p.starter);
    const bench = atPos.filter((p) => !p.starter && p.injuryWeeks === 0 && !injured.has(p.id));
    const tired = [...starters].sort((a, b) => (injured.has(b.id) ? 1000 : 0) - (injured.has(a.id) ? 1000 : 0) || e(a) - e(b))[0];
    const row = (p, isStarter) => `<div class="flex items-center gap-2 text-xs py-0.5 ${isStarter ? '' : 'opacity-75'}">
        <span class="w-4">${isStarter ? '★' : ''}</span><span class="flex-1 truncate">${esc(p.name)} <span class="${ovrClass(p.ovr)} font-bold">${p.ovr}</span>${injured.has(p.id) || p.injuryWeeks ? ' 🚑' : ''}</span>
        <div class="w-16">${bar(e(p), energyColor(e(p)), 'h-1.5')}</div><span class="w-7 text-right">${e(p)}%</span>
        ${!isStarter ? (tired ? `<button ${gameAttr({ type: 'SWAP_STARTER', inId: p.id, outId: tired.id })} class="btn bg-sky-700 !px-1.5 !py-0.5 text-[10px]" title="Entra no lugar de ${esc(tired.name)}">⇄ ${esc(tired.name.split(' ').pop())}</button>` : `<button ${gameAttr({ type: 'TOGGLE_STARTER', playerId: p.id })} class="btn bg-sky-700 !px-1.5 !py-0.5 text-[10px]">Entrar</button>`) : ''}
      </div>`;
    return `<div class="mb-2"><div class="text-[10px] font-bold text-slate-400 uppercase">${pos}</div>${starters.map((p) => row(p, true)).join('')}${bench.map((p) => row(p, false)).join('')}</div>`;
  }).join('');
  return `<div class="rounded-lg border-2 team-border bg-slate-900 p-3 mt-3">
    <div class="flex items-center justify-between mb-2"><h3 class="font-black">☕ Prancheta do Técnico</h3><button ${gameAttr({ type: 'AUTO_LINEUP' })} class="btn bg-slate-700 text-xs">⚙️ Auto (considera cansaço)</button></div>
    <div class="grid md:grid-cols-2 gap-3">
      <div class="space-y-2">
        <div><div class="text-xs font-bold text-slate-400 mb-1">Ataque</div>${tacticButtons(s, 'offense', OFFENSIVE_SCHEMES, true)}</div>
        <div><div class="text-xs font-bold text-slate-400 mb-1">Defesa</div>${tacticButtons(s, 'defense', DEFENSIVE_SCHEMES, true)}</div>
        <div><div class="text-xs font-bold text-slate-400 mb-1">4ª descida</div>${tacticButtons(s, 'fourthDown', FOURTH_DOWN_POSTURES, true)}</div>
      </div>
      <div class="max-h-80 overflow-y-auto scroll-thin pr-1">${groups}</div>
    </div></div>`;
}
function scoreFlash(m, side) {
  const key = `${m.id}-${side}`;
  const changed = prevScores.has(key) && prevScores.get(key) !== m.score[side];
  prevScores.set(key, m.score[side]);
  return changed ? 'flash' : '';
}
function renderLiveRound(s) {
  const lr = s.liveRound;
  const m = lr.matches[0];
  const home = s.teams[m.homeId], away = s.teams[m.awayId];
  const allFinal = lr.matches.every((x) => x.status.kind === 'FINAL');
  const userPlays = m.verbose;
  const final = m.status.kind === 'FINAL';
  const str = liveStrength(s, m);
  const title = s.phase.kind === 'REGULAR_SEASON' ? `Semana ${s.phase.week}` : PHASE_LABELS[s.phase.kind];
  const teamBlock = (t, side) => `<div class="flex-1 rounded-lg p-3 text-center ${m.possession === side && !final ? 'ring-4 ring-yellow-300/80' : ''}" style="background:${t.colors.primary};color:${textOn(t.colors.primary)};border-bottom:5px solid ${t.colors.secondary}">
      <div class="text-xs font-semibold opacity-80">${esc(t.city)} ${side === 'home' && !m.neutral ? '· Casa' : ''}</div>
      <div class="font-black text-lg leading-tight">${esc(t.name)} ${m.possession === side && !final ? '🏈' : ''}</div>
      <div class="text-6xl font-black tabular-nums rounded ${scoreFlash(m, side)}">${m.score[side]}</div></div>`;
  const yardTxt = m.ballOn === 50 ? 'meio-campo' : m.ballOn < 50 ? `própria ${m.ballOn}` : `adversária ${100 - m.ballOn}`;
  const center = final
    ? `<div class="text-2xl font-black text-amber-300">FINAL</div><div class="text-xs text-slate-400">${m.quarter >= 5 ? 'após prorrogação' : ''}</div>`
    : `<div class="text-xl font-black">${quarterLabel(m.quarter)}</div><div class="text-3xl font-black tabular-nums text-amber-300">${fmtClock(m.clock)}</div>
       <div class="text-xs text-slate-300 mt-1">${m.down}ª e ${100 - m.ballOn <= m.toGo ? 'gol' : m.toGo}</div><div class="text-[10px] text-slate-500">${yardTxt}</div>`;
  const log = [...m.events].reverse().slice(0, 80).map((e) => `<div class="px-2 py-1 rounded text-xs ${eventStyle(e)}"><span class="text-slate-500 mr-1 tabular-nums">${quarterLabel(e.quarter)} ${fmtClock(e.clock)}</span>${esc(e.text)}</div>`).join('');
  const others = lr.matches.slice(1).map((x) => {
    const h = s.teams[x.homeId], a = s.teams[x.awayId];
    const lastScore = [...x.events].reverse().find((e) => e.type === 'TOUCHDOWN' || (e.type === 'FIELD_GOAL' && e.good) || e.type === 'SAFETY');
    const fin = x.status.kind === 'FINAL';
    return `<div class="rounded-md bg-slate-800/70 p-2">
      <div class="flex items-center gap-2">${teamChip(a)}<span class="font-black text-lg w-8 text-right tabular-nums ${scoreFlash(x, 'away')}">${x.score.away}</span><span class="text-slate-500">${x.neutral ? 'vs' : '@'}</span><span class="font-black text-lg w-8 tabular-nums ${scoreFlash(x, 'home')}">${x.score.home}</span>${teamChip(h)}
        <span class="ml-auto text-xs ${fin ? 'text-amber-300 font-bold' : 'text-slate-400'}">${fin ? 'FIM' : `${quarterLabel(x.quarter)} ${fmtClock(x.clock)}`}</span></div>
      ${lastScore ? `<div class="text-[10px] text-slate-400 truncate mt-1">${esc(lastScore.text)}</div>` : ''}</div>`;
  }).join('');
  const speedBtn = (v) => `<button ${uiAttr({ type: 'SET_SPEED', speed: v })} class="btn ${ui.live.speed === v ? 'team-accent-bg' : 'bg-slate-800'}">${v}x</button>`;
  const controls = allFinal
    ? `<button ${uiAttr({ type: 'FINISH_ROUND' })} class="btn team-accent-bg px-6 py-2.5 text-base animate-pulse">Continuar ▶</button>`
    : `${speedBtn(1)}${speedBtn(2)}${speedBtn(5)}
       <button ${uiAttr({ type: 'TOGGLE_PAUSE' })} class="btn ${ui.live.paused ? 'bg-emerald-700' : 'bg-amber-600 text-black'}">${ui.live.paused ? '▶ Retomar' : '⏸ Pausar / Táticas'}</button>
       <button ${uiAttr({ type: 'SIM_TO_END' })} class="btn bg-slate-700">⏭ Simular até o fim</button>`;
  return `<div class="flex flex-wrap items-center gap-2 mb-3">
      <h2 class="text-xl font-black mr-auto">📺 Rodada ao vivo — ${title}</h2>${controls}</div>
    ${ui.live.paused && !allFinal ? `<div class="mb-3 rounded bg-amber-500/20 border border-amber-500 text-amber-200 text-sm px-3 py-2">⏸ Jogo pausado${m.quarter === 3 && ui.live.halftimeShown && m.clock > 840 ? ' — INTERVALO' : ''}. ${userPlays ? 'Ajuste táticas e substitua jogadores cansados na prancheta abaixo.' : ''}</div>` : ''}
    <div class="grid lg:grid-cols-3 gap-4">
      <div class="lg:col-span-2">
        <div class="rounded-xl bg-slate-900 border border-slate-700 p-3">
          <div class="text-xs text-slate-400 mb-2">${userPlays ? '⭐ Seu jogo' : '📡 Jogo em destaque'}${m.playoff ? ' · Playoffs' : ''}${m.neutral ? ' · Campo neutro' : ''}</div>
          <div class="flex items-stretch gap-3">${teamBlock(away, 'away')}<div class="w-28 flex flex-col items-center justify-center text-center">${center}</div>${teamBlock(home, 'home')}</div>
          <div class="mt-3">${renderField(m, home, away)}</div>
          <div class="text-sm mt-2 px-1 text-slate-200 min-h-[1.5rem]">${esc(m.lastText)}</div>
          <div class="grid sm:grid-cols-2 gap-x-6 mt-2">
            ${duel(`${away.abbr} Ataque`, str.away.offense, `Defesa ${home.abbr}`, str.home.defense, away.colors.primary === '#000000' ? '#555' : away.colors.primary, home.colors.secondary)}
            ${duel(`${home.abbr} Ataque`, str.home.offense, `Defesa ${away.abbr}`, str.away.defense, home.colors.primary === '#000000' ? '#555' : home.colors.primary, away.colors.secondary)}
          </div>
        </div>
        ${userPlays && ui.live.paused && !final ? renderLivePanel(s, m) : ''}
        <div class="rounded-xl bg-slate-900 border border-slate-700 mt-3">
          <div class="px-3 py-2 text-xs font-bold uppercase text-slate-400 border-b border-slate-700">📜 Lance a lance</div>
          <div class="max-h-96 overflow-y-auto scroll-thin p-2 space-y-0.5">${log}</div>
        </div>
      </div>
      <div>
        <div class="rounded-xl bg-slate-900 border border-slate-700 p-3">
          <div class="text-xs font-bold uppercase text-slate-400 mb-2">📻 Placar da Rodada</div>
          <div class="space-y-2">${others || '<div class="text-xs text-slate-500">Único jogo da rodada.</div>'}</div>
        </div>
      </div>
    </div>`;
}

// --- 4.12 Composição principal ------------------------------------------------------
function renderConfirm() {
  if (!ui.pendingConfirm) return '';
  return `<div class="fixed inset-0 z-40 bg-black/70 flex items-center justify-center px-4">
    <div class="w-full max-w-md rounded-xl border-2 team-border bg-slate-900 p-5 shadow-2xl">
      <div class="font-bold text-lg mb-1">Confirmar</div>
      <p class="text-sm text-slate-300">${esc(ui.pendingConfirm.text)}</p>
      <div class="flex justify-end gap-2 mt-5">
        <button ${uiAttr({ type: 'CONFIRM_NO' })} class="btn bg-slate-700">Cancelar</button>
        <button ${uiAttr({ type: 'CONFIRM_YES' })} class="btn bg-amber-500 text-black">Confirmar</button>
      </div></div></div>`;
}
function renderToast() {
  if (!ui.toast) return '';
  const cls = { error: 'bg-red-700', info: 'bg-slate-700', good: 'bg-emerald-700' }[ui.toast.kind] || 'bg-slate-700';
  return `<div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 ${cls} text-white px-4 py-2.5 rounded-lg shadow-2xl text-sm font-semibold max-w-[90vw]">${esc(ui.toast.text)}</div>`;
}
function renderView(s) {
  switch (ui.view) {
    case 'draft': return s.phase.kind === 'OFFSEASON_DRAFT' ? renderDraft(s) : renderRoster(s);
    case 'tactics': return renderTactics(s);
    case 'standings': return renderStandings(s);
    case 'schedule': return renderSchedule(s);
    case 'market': return renderMarket(s);
    case 'finances': return renderFinances(s);
    case 'news': return renderNews(s);
    default: return renderRoster(s);
  }
}
const app = document.getElementById('app');
function render() {
  const s = store.getState();
  if (!s) { document.documentElement.removeAttribute('style'); app.innerHTML = renderTeamSelect() + renderConfirm() + renderToast(); return; }
  applyTheme(s.teams[s.userTeamId]);
  if (ui.view === 'draft' && s.phase.kind !== 'OFFSEASON_DRAFT') ui.view = 'roster';
  let body;
  if (s.phase.kind === 'GAME_OVER') body = renderGameOver(s);
  else if (s.liveRound) body = renderLiveRound(s);
  else body = (s.phase.kind === 'SEASON_RECAP' ? renderRecapBanner(s) : '') + renderTabs(s) + renderView(s);
  app.innerHTML = `${renderHeader(s)}<main class="max-w-7xl mx-auto px-4 py-4">${body}</main>
    <footer class="text-center text-[11px] text-slate-600 pb-6">GridironFoot · salvo automaticamente · ${LEAGUE_RULES.SALARY_CAP}M de Salary Cap · ${s.teamOrder.length} franquias</footer>${renderConfirm()}${renderToast()}`;
}

// --- 4.13 Controladores (eventos → ações) -------------------------------------------
let tickTimer = null;
function allFinal(s) { return !s || !s.liveRound || s.liveRound.matches.every((m) => m.status.kind === 'FINAL'); }
function scheduleTick() {
  clearTimeout(tickTimer);
  const s = store.getState();
  if (!s || !s.liveRound || ui.live.paused || allFinal(s)) return;
  tickTimer = setTimeout(() => {
    store.dispatch({ type: 'SIM_TICK' });
    checkHalftime();
    scheduleTick();
  }, BASE_TICK_MS / ui.live.speed);
}
function checkHalftime() {
  const m = store.getState()?.liveRound?.matches[0];
  if (m && m.verbose && !ui.live.halftimeShown && m.quarter >= 3 && m.status.kind === 'LIVE') {
    ui.live.halftimeShown = true;
    ui.live.paused = true;
    showToast('☕ Intervalo! Ajuste táticas e substituições.', 'info');
    render();
  }
}
/** Valida e despacha uma GameAction, exibindo o motivo quando inválida. */
function dispatchGame(action) {
  const err = validateAction(store.getState(), action);
  if (err) { showToast(err, 'error'); render(); return false; }
  store.dispatch(action);
  return true;
}
function handleUi(a) {
  switch (a.type) {
    case 'CHOOSE_TEAM':
      if (dispatchGame({ type: 'NEW_GAME', userTeamId: a.teamId })) { ui.view = 'roster'; ui.scheduleWeek = null; }
      break;
    case 'NEW_GAME':
      ui.pendingConfirm = { text: 'Abandonar o jogo atual e começar do zero? O save será apagado.', ui: { type: 'NEW_GAME_CONFIRMED' } };
      break;
    case 'CONFIRM_NO': ui.pendingConfirm = null; break;
    case 'CONFIRM_YES': {
      const pending = ui.pendingConfirm;
      ui.pendingConfirm = null;
      if (pending?.game) dispatchGame(pending.game);
      if (pending?.ui) { handleUi(pending.ui); return; }
      break;
    }
    case 'NEW_GAME_CONFIRMED':
      clearTimeout(tickTimer);
      prevScores.clear();
      store.replace(null);
      break;
    case 'SET_VIEW': ui.view = a.view; break;
    case 'SORT_ROSTER': ui.rosterSort = { key: a.key, dir: ui.rosterSort.key === a.key ? -ui.rosterSort.dir : (a.key === 'pos' || a.key === 'name' ? 1 : -1) }; break;
    case 'MARKET_TAB': ui.marketTab = a.tab; break;
    case 'MARKET_POS': ui.marketPos = a.pos; break;
    case 'DRAFT_POS': ui.draftPos = a.pos; break;
    case 'SCHEDULE_WEEK': ui.scheduleWeek = a.week; break;
    case 'GAME':
      if (dispatchGame(a.game) && a.view) ui.view = a.view;
      break;
    case 'PLAY_WEEK':
      if (dispatchGame({ type: 'START_WEEK' })) {
        ui.live = { speed: ui.live.speed, paused: false, halftimeShown: false };
        prevScores.clear();
        window.scrollTo({ top: 0 });
        scheduleTick();
      }
      break;
    case 'SET_SPEED': ui.live.speed = a.speed; scheduleTick(); break;
    case 'TOGGLE_PAUSE': ui.live.paused = !ui.live.paused; scheduleTick(); break;
    case 'SIM_TO_END': clearTimeout(tickTimer); ui.live.halftimeShown = true; dispatchGame({ type: 'SIM_TO_END' }); break;
    case 'FINISH_ROUND':
      if (dispatchGame({ type: 'FINISH_WEEK' })) {
        const s = store.getState();
        ui.scheduleWeek = null;
        ui.view = s.phase.kind === 'SEASON_RECAP' ? 'standings' : ui.view === 'draft' ? 'roster' : ui.view;
      }
      break;
    default: break;
  }
  render();
}

document.addEventListener('click', (ev) => {
  const el = /** @type {HTMLElement} */ (ev.target).closest('[data-game],[data-ui]');
  if (!el) return;
  if (el.dataset.game) {
    const action = JSON.parse(el.dataset.game);
    const err = validateAction(store.getState(), action);
    if (err) { showToast(err, 'error'); render(); return; }
    if (el.dataset.confirm) { ui.pendingConfirm = { text: el.dataset.confirm, game: action }; render(); return; }
    dispatchGame(action);
  } else {
    handleUi(JSON.parse(el.dataset.ui));
  }
});
document.addEventListener('keydown', (ev) => {
  if (ev.code !== 'Space' || !store.getState()?.liveRound || allFinal(store.getState())) return;
  ev.preventDefault();
  handleUi({ type: 'TOGGLE_PAUSE' });
});

// --- 4.14 Boot ----------------------------------------------------------------------
store.subscribe(() => render());
if (store.getState()?.liveRound) { ui.live.paused = true; ui.live.halftimeShown = true; }
render();
</script>
</body>
</html>
